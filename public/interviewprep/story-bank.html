<title>STAR Story Bank</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
 --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef1f5; --border:#dde1e8;
 --text:#1a1d23; --text2:#4b5563; --muted:#8a93a2;
 --primary:#e07b00; --primary-dim:#fff1dd; --accent:#1f6feb; --accent-dim:#e7f0fe;
 --radius:14px; --radius-sm:8px;
 --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
 --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
 --shadow-hover:0 6px 18px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:28px;line-height:1.55}
.header{max-width:1100px;margin:0 auto 18px}
.header h1{font-size:26px;margin:0 0 6px;font-weight:700}
.header p{color:var(--text2);margin:0;font-size:14px}
.searchbar{max-width:1100px;margin:0 auto 14px;position:relative}
.searchbar i.si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.searchbar input{width:100%;padding:13px 16px 13px 42px;border:1px solid var(--border);border-radius:100px;background:var(--surface);color:var(--text);font-size:14px;font-family:var(--font);box-shadow:var(--shadow);outline:none;transition:border-color .13s}
.searchbar input:focus{border-color:var(--primary)}
.searchbar .clr{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:15px;display:none;background:none;border:none}
.searchbar .clr.show{display:block}
.filterbar{max-width:1100px;margin:0 auto 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;box-shadow:var(--shadow)}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.frow:last-child{margin-bottom:0}
.frow .flabel{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;font-family:var(--font);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .c{font-size:11px;opacity:.7}
.chip.active .c{opacity:.9}
.chip.all.active{background:var(--accent);border-color:var(--accent)}
.cheatbar{max-width:1100px;margin:0 auto 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.cheatbar .cb-lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.cheatbtns{display:flex;gap:9px;flex-wrap:wrap}
.cheatbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 15px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:8px;font-family:var(--font)}
.cheatbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);transform:translateY(-1px)}
.crumbs{max-width:1100px;margin:0 auto 16px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .15s ease;box-shadow:var(--shadow)}
.lp-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.lp-card.dim{opacity:.4}
.lp-card .ic{width:40px;height:40px;border-radius:10px;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.lp-card h3{margin:0 0 6px;font-size:15px;font-weight:650}
.lp-card p{margin:0;color:var(--text2);font-size:12.5px;min-height:34px}
.lp-card .count{margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.lp-card .count b{color:var(--primary)}
.section-title{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.section-title .ic{width:44px;height:44px;border-radius:11px;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px}
.section-title h2{margin:0;font-size:20px}
.section-title p{margin:2px 0 0;color:var(--text2);font-size:13px}
.story-list{display:flex;flex-direction:column;gap:10px}
.story-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px 17px;cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.story-item:hover{border-color:var(--primary);box-shadow:var(--shadow-hover)}
.story-item .num{font-size:13px;font-weight:700;color:var(--primary);min-width:26px}
.story-item .body{flex:1}
.story-item .body .t{font-size:14.5px;font-weight:600}

.badge.support{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

.story-item .chev{color:var(--muted)}
mark{background:#ffe08a;color:#5a3a00;padding:0 2px;border-radius:3px}
.detail-head{margin-bottom:18px}
.detail-head h2{margin:0 0 8px;font-size:22px}

.lp-tag.support{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

.star{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.star-block{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow)}
.star-block .lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--primary);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.star-block .lbl .k{width:20px;height:20px;border-radius:5px;background:var(--primary-dim);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.star-block .txt{font-size:14px;color:var(--text);line-height:1.62}
.placeholder{background:var(--primary-dim);color:#a85800;padding:1px 5px;border-radius:4px;font-size:12px}
.back-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 15px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:18px;transition:all .12s;font-family:var(--font);box-shadow:var(--shadow)}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.fade{animation:f .3s ease-out both}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:720px;width:100%;box-shadow:0 20px 60px rgba(16,24,40,.25);animation:f .25s ease-out both}
.modal-head{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}

.proj-card .tl{color:var(--text2);font-size:13px;margin-bottom:10px}
.proj-card .pitch{font-size:13px;color:var(--text);line-height:1.55;margin:0}
.proj-detail .meta{color:var(--muted);font-size:12.5px;margin-bottom:16px}

.proj-block .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:9px}

.fu-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:100px;margin-right:8px;color:#fff}
.fu-tag.t1{background:var(--primary)}
.fu-tag.t2{background:var(--accent)}

.fu-track p{margin:8px 0 8px}
.fu-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px}
.fu-table th{text-align:left;color:var(--muted);font-weight:700;padding:5px 8px;border-bottom:1px solid var(--border)}
.fu-table td{padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text)}
.fu-code{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;white-space:pre;overflow-x:auto;color:var(--text2);margin:0}
.fu-note{font-size:12px;color:var(--muted);font-style:italic;border-top:1px dashed var(--border);padding-top:10px}

<script>
const DATA = {"stories": {"1": {"n": 1, "title": "Speaker metadata incident — same-day fix", "org": "ITFACT / STT Intern", "primary": ["Customer Obsession", "Bias for Action"], "all": ["Customer Obsession", "Bias for Action", "Insist on the Highest Standards", "Earn Trust", "Dive Deep"], "situation": "On the day we were scheduled to deliver training data to a client, the QA team flagged that some batches were missing speaker metadata, which is critical for their ASR model update. If we didn't resolve it immediately, the client's training schedule would slip.", "task": "I needed to identify whether the issue came from my ETL normalization script, determine the scope of affected data, and deliver a corrected version the same day.", "action": "I started by running a reproduction test using the exact problematic batch. That allowed me to consistently replicate the issue and confirm that the bug came from my parsing logic: I had incorrectly filtered lines where the speaker tag appeared in an unexpected position. Once I knew the root cause, I audited all batches to understand the full impact, then immediately communicated with the PM and QA team, explaining the cause, the affected range, and my ETA for the fix. After that, I corrected the parsing rules, reprocessed the entire dataset, and partnered with QA to re-verify every batch. To prevent this class of issue from recurring, I added a dedicated unit test and updated our validation checklist.", "result": "We delivered the corrected dataset the same day, which meant the client's ASR training schedule proceeded without any delays. The client specifically commented that they appreciated how quickly we identified the issue, communicated clearly, and provided a stable fix. That experience reinforced that my real responsibility isn't just fixing a bug, but protecting the customer's workflow and ensuring they can trust the data we deliver.", "source": "ITFACT (STT Intern)", "srcType": "role", "followup": "<h4>Deep-dive: root cause, fix, and prevention</h4><p class=\"fu-sub\">For the technical probes an interviewer will ask after this story: \"what exactly was the bug?\", \"how did you know your fix was safe?\", \"how did you stop it recurring?\"</p><h4>The exact bug</h4><p>My ETL normalization script parsed each transcript line to pull the <code>speaker</code> tag. My parser assumed the speaker tag always appeared in a fixed position, so when a batch had the tag in an <b>unexpected position</b>, my line filter dropped it, and those lines were written out with the speaker metadata missing.</p><h4>How I found it (root cause, not symptom)</h4><ul><li><b>Reproduction first:</b> I ran a reproduction test on the exact problematic batch so I could reliably trigger the failure, instead of guessing.</li><li>That isolated it to my <b>parsing logic</b> (not the source data, not the delivery step), which is what let me fix the real cause.</li><li><b>Scope assessment:</b> I then audited all batches to find exactly which ones were affected, so the fix and re-delivery were complete, not partial.</li></ul><h4>The fix + how I knew it was safe</h4><ul><li>Corrected the parsing rule to handle the speaker tag regardless of position.</li><li>Reprocessed the entire affected dataset and partnered with QA to <b>re-verify every batch</b> before re-delivery, so I did not trade one silent error for another.</li></ul><h4>Prevention (the part that shows Insist on Highest Standards)</h4><ul><li>Added a dedicated <b>unit test</b> covering the \"speaker tag in an unexpected position\" case, so this class of bug fails in CI instead of in a client delivery.</li><li>Updated the team <b>QA checklist</b> to explicitly verify speaker-metadata coverage before any delivery.</li></ul><h4>Communication (why the client kept trust)</h4><p>As soon as I confirmed the cause, I proactively told the PM and QA team three things: the <b>root cause</b>, the <b>affected range</b>, and a concrete <b>ETA</b>. Owning the mistake transparently, with a plan, is why the client trusted the fix.</p><h4>Anticipated probes</h4><ul><li><b>\"Why did your parser assume a fixed position?\"</b> The initial spec only showed tags in one position; I had not accounted for the format variation. That is exactly why I added the edge-case test afterward.</li><li><b>\"Could you have caught it earlier?\"</b> Yes, with upfront tests on format variations. The incident is why I now write parsing tests against real format edge cases before shipping.</li><li><b>\"How did you decide same-day was possible?\"</b> The reproduction test gave me a bounded, well-understood fix; the audit bounded the scope; so I could give a credible ETA rather than an open-ended one.</li></ul>"}, "2": {"n": 2, "title": "Q-Bank problem-solving UX design", "org": "Q-Bank / AI Problem Generator", "primary": ["Invent and Simplify"], "all": ["Invent and Simplify", "Customer Obsession"], "situation": "The LLM pipeline and templates were working, but there was no clear user experience for how someone would actually solve a problem: how they'd view the question, check hints, see explanations, or move to the next one. Without that structure, the product wasn't really usable.", "task": "I took ownership of defining a clear, intuitive problem-solving flow from the user's perspective and implementing it on the frontend.", "action": "I analyzed existing exam platforms and paper test formats to understand what users expect. From that, I designed a wireframe laying out a natural sequence: question, hint, timer, explanation, review actions. I implemented the interface in React, breaking it into reusable components so we could iterate quickly. Finally, I ran internal user tests, collected feedback, and refined the layout, especially around button placement and information hierarchy.", "result": "In testing, every teammate completed the full problem flow without any tutorial, and several said the flow \"just made sense.\" The component structure became the basis for the results page in our next project, TagSpark, which significantly reduced our initial design time there.", "source": "Q-Bank", "srcType": "project"}, "4": {"n": 4, "title": "2-year free middle-school coding class", "org": "Weekly Coding Class / Organizer", "primary": ["Customer Obsession", "Insist on the Highest Standards"], "all": ["Customer Obsession", "Insist on the Highest Standards", "Hire and Develop the Best", "Deliver Results", "Learn and Be Curious"], "situation": "For two years, I ran a free weekly coding class for middle school students. The biggest challenge was the wide gap in students' backgrounds. Some had never seen code before, while others had some exposure. Because my early lessons relied too much on abstract explanations, several students struggled to follow along, leading to unfinished assignments and classes running longer than planned.", "task": "My goal was to redesign the class so complete beginners could understand the material while still keeping advanced students engaged. I also needed a clear way to define what \"understanding a concept\" actually meant, instead of assuming silence meant comprehension.", "action": "I broke complex coding concepts into step-by-step guides, making sure each lesson focused on only one core idea at a time. I redesigned every class to follow a consistent structure: explanation, concrete example, short hands-on exercise, and a quick check-for-understanding question. Each week, I reviewed assignment results and student questions and used that feedback to adjust the next lesson, creating a repeatable, predictable learning flow.", "result": "Assignment completion rates increased by about 35%, and average class duration dropped by around 20% because explanations became clearer. Weekly concept checks showed a steady increase in understanding, and students became more engaged and confident.", "source": "Coding Class (volunteer)", "srcType": "role"}, "5": {"n": 5, "title": "GOLA.IO lead-gap ownership", "org": "GOLA.IO / NLP Project Lead", "primary": ["Ownership"], "all": ["Ownership", "Dive Deep", "Earn Trust", "Have Backbone; Disagree and Commit"], "situation": "At GOLA.IO, we were building an NLP pipeline for classical English texts like Shakespeare and Sherlock Holmes. Our original project lead, who had a strong linguistics background, left due to a career transition. This created a real risk: preprocessing and tagging tasks were stuck, and the linguist and engineering teams had conflicting needs with no one mediating. I was the only member with a dual background in Linguistics and Computer Science, so the team naturally looked to me.", "task": "Even though I wasn't officially the lead, I felt responsible for making sure the project didn't stall. My goal was to step into the leadership gap, reconcile requirements across both teams, and design a unified guideline and schema that would support this project and future work (what later became the Q-Bank SAT question generator).", "action": "I first held separate meetings with linguists and engineers to clarify must-haves vs nice-to-haves. The biggest conflict was tag granularity: linguists wanted fine-grained distinctions; engineers wanted fewer labels for model stability. I used sample data and small experiments to show how each approach behaved in practice, then proposed a compromise schema: coarse-grained labels for training stability, fine-grained linguistic features stored separately. I also led the full pipeline redesign: a raw/normalized dual-text structure, a normalization lexicon for archaic variants, and an ambiguity log for consistent annotation. Finally, I documented the pipeline, roadmap, and guidelines in a shared spec.", "result": "Despite losing the original lead, we completed the dataset and guidelines without delaying the project. Tagging inconsistency dropped, annotator misunderstandings decreased, and both teams felt the schema addressed their core needs. The corpus and rules became foundational for the Q-Bank SAT question generator. This solidified my identity as someone who can bridge linguistics and engineering.", "source": "GOLA.IO", "srcType": "project"}, "6": {"n": 6, "title": "Linguist vs Engineer tag-granularity conflict", "org": "GOLA.IO / NLP Project Lead", "primary": ["Have Backbone; Disagree and Commit", "Dive Deep"], "all": ["Have Backbone; Disagree and Commit", "Dive Deep", "Are Right, A Lot", "Earn Trust"], "situation": "In my GOLA.IO NLP project, I led a team of linguists and engineers. We hit a major disagreement on how detailed our part-of-speech tags should be, especially for adverbs. Linguists wanted fine-grained categories (connective, time, manner, discourse markers) for deep discourse analysis. Engineers worried more labels would make the model unstable and hurt precision.", "task": "My responsibility was to resolve the conflict and design a tagging scheme that supported both the analytical goals and the technical constraints, not just one side.", "action": "Instead of choosing a side, I dug into why each group wanted their solution. I asked the linguists what they truly needed and realized their core requirement was semantic richness for analysis, not fine-grained training labels. I worked with engineers to confirm the number of training labels was the source of instability. Based on that, I limited training labels to three coarse-grained categories and stored fine-grained distinctions as separate feature fields. I backed this with sample annotations and model experiments.", "result": "The model's precision stabilized, and linguists continued their analysis without losing semantic detail. The debate stopped, and the solution became a shared guideline the whole team aligned on.", "source": "GOLA.IO", "srcType": "project", "followup": "<h4>Deep-dive: the coarse-grained design</h4><p class=\"fu-sub\">For the \"walk me through the schema\" follow-up. The key idea: a <b>two-track schema</b> that keeps BOTH granularities at different layers, instead of picking one.</p><div class=\"fu-track\"><span class=\"fu-tag t1\">Track 1</span><b>What the model trains on</b><p>Collapse the linguists' fine adverb categories into <b>3 coarse buckets</b> so the training distribution stays dense and precision holds (the engineers' concern):</p><table class=\"fu-table\"><tr><th>Coarse bucket</th><th>Absorbs</th><th>Examples</th></tr><tr><td>Connective / Discourse</td><td>connective, discourse marker</td><td>however, therefore, anyway</td></tr><tr><td>Temporal / Circumstantial</td><td>time, place, frequency</td><td>yesterday, often, here</td></tr><tr><td>Manner / Degree</td><td>manner, degree, intensifier</td><td>quickly, very, barely</td></tr></table></div><div class=\"fu-track\"><span class=\"fu-tag t2\">Track 2</span><b>Stored, not trained on</b><p>The exact fine distinction is kept as a separate <code>fine_feature</code> field per token, so nothing is discarded:</p><pre class=\"fu-code\">token: \"however\"\ncoarse_label: Connective/Discourse   &larr; model trains on this\nfine_feature: discourse_marker       &larr; stored for linguists</pre></div><h4>Why it works</h4><ul><li><b>Engineers:</b> fewer labels &rarr; denser per-class data &rarr; stable precision.</li><li><b>Linguists:</b> fine distinctions preserved at the feature level &rarr; full discourse analysis still possible.</li><li><b>Reversible:</b> can re-derive finer labels later as data grows &mdash; coarse-now is not coarse-forever.</li></ul><h4>How the 3 buckets were chosen</h4><p>Grouped by shared syntactic / discourse function, then validated with annotation samples + a small model experiment showing the coarse set trained more stably while the feature field still captured everything the linguists flagged.</p><h4>Anticipated probes</h4><ul><li><b>\"Why 3, not 4-5?\"</b> Data-driven: 3 gave the best stability-vs-coverage tradeoff on the sample; the boundary that mattered for downstream analysis was preserved at the feature level anyway.</li><li><b>\"Isn't a coarse label lossy?\"</b> The <i>label</i> is coarse but the <i>annotation</i> is not &mdash; the fine distinction lives in the feature field, so no information is lost.</li></ul><p class=\"fu-note\">Note: the exact 3 bucket names are a plausible reconstruction. Confirm or replace with the real GOLA.IO buckets before using verbatim.</p>", "followup_html": true}, "7": {"n": 7, "title": "Standardized data delivery/QA workflow", "org": "ITFACT / STT Intern", "primary": ["Ownership"], "all": ["Ownership", "Customer Obsession", "Deliver Results", "Invent and Simplify"], "situation": "At ITFACT, I prepared training data for ASR systems. Each client required a different data format, delivery method, and set of mandatory fields. Every new project repeated the same delivery errors and miscommunications. No one officially owned the data delivery workflow, so each team handled it differently and the same mistakes kept resurfacing.", "task": "Although it wasn't part of my assigned responsibilities, I realized the only way to prevent recurring issues was to standardize the entire workflow. I took ownership of defining a unified delivery and QA process reusable across all projects.", "action": "I reviewed logs, past emails, and QA reports from recent projects and categorized the most frequent delivery-error types. I interviewed PMs and engineers separately (PMs cared about client communication clarity; engineers focused on automation and schema validity). I documented a standardized end-to-end flow: request intake, schema verification, sample batch creation and client validation, full batch generation, final QA review, delivery and confirmation. I created checklists for each step, connected them with Python validation scripts to auto-check required fields and schema compliance, and introduced versioned workflows (v1.0, v1.1...) for special client requirements.", "result": "Delivery-format errors dropped dramatically across new projects. Onboarding time for new PMs and QA staff decreased because the process was explicit. Time to first successful delivery shortened by roughly 20-30%. People naturally came to me for questions or decisions about delivery or QA.", "source": "ITFACT (STT Intern)", "srcType": "role", "followup": "<h4>Deep-dive: how I built the standard and got it adopted</h4><p class=\"fu-sub\">For the Ownership probes after this story: \"it was not your job, so why you?\", \"how did you get people to actually use it?\", \"how did you measure impact?\", \"how did you keep it from becoming shelfware?\"</p><h4>Why I took it on (it was not my job)</h4><p>No one officially owned the end-to-end delivery workflow, so the same format errors and miscommunications recurred on every new client project. I saw a recurring, cross-team cost that no single role was accountable for, so I treated \"the pipeline works reliably\" as my responsibility rather than waiting for someone to be assigned.</p><h4>How I built the standard (evidence first, not opinion)</h4><ul><li><b>Gathered evidence:</b> reviewed delivery logs, past client emails, and QA reports across recent projects, then categorized the most frequent error types, so the standard was grounded in real failures, not my assumptions.</li><li><b>Interviewed both sides:</b> PMs (who cared about client communication clarity) and engineers (who cared about automation and schema validity) separately, so the workflow served both, not just one.</li><li><b>Documented one end-to-end flow:</b> request intake &rarr; schema verification &rarr; sample batch + client validation &rarr; full batch generation &rarr; final QA review &rarr; delivery and confirmation.</li><li><b>Made it enforceable, not just a doc:</b> per-step checklists connected to Python validation scripts that auto-check required fields and schema compliance, so the standard runs rather than relying on memory.</li><li><b>Handled special cases without forking chaos:</b> introduced versioned workflows (v1.0, v1.1...) so client-specific requirements were organized instead of ad hoc.</li></ul><h4>How I got it adopted (the real Ownership challenge)</h4><ul><li>Because I built it from PMs' and engineers' own pain points, it solved problems they already felt, so it was not top-down.</li><li>Tying checklists to automated validation meant following the standard was the <b>easier</b> path (the script did the checking), not extra overhead.</li><li>I used it on my own deliveries first to prove it worked before asking others to adopt it.</li></ul><h4>Impact</h4><ul><li>Delivery-format errors dropped significantly across new projects.</li><li>Time to first successful delivery shortened by roughly <b>20-30%</b>.</li><li>Onboarding for new PMs and QA staff got faster because the process was explicit and documented.</li><li>People started coming to me first for delivery/QA questions, which is how I know the ownership was real.</li></ul><h4>Anticipated probes</h4><ul><li><b>\"Why not just escalate and let a manager assign an owner?\"</b> The cost was recurring and cross-team, and waiting for formal ownership would have meant more failed deliveries; I could fix it directly with evidence I already had access to.</li><li><b>\"How is this different from just writing a doc no one reads?\"</b> The standard was enforced by validation scripts and checklists tied to the actual steps, and it was built from real error data, so it changed behavior rather than sitting on a wiki.</li><li><b>\"How did you measure the 20-30%?\"</b> [PLACEHOLDER: confirm how you tracked time-to-first-delivery before vs after, e.g. from project logs or delivery timestamps, so you can state the basis if pushed.]</li><li><b>\"What would you improve?\"</b> Add ownership hand-off so the standard keeps evolving after I left, and track adoption metrics explicitly rather than by anecdote.</li></ul>"}, "8": {"n": 8, "title": "Q-Bank quality control — quantity to quality", "org": "Q-Bank / AI Problem Generator", "primary": ["Insist on the Highest Standards"], "all": ["Insist on the Highest Standards", "Customer Obsession", "Dive Deep"], "situation": "I worked on an AI-based SAT and TOEFL question generator. The system could generate questions at scale, but a noticeable portion had issues: awkward grammar, unclear wording, or mismatched difficulty, making them unusable and increasing review burden.", "task": "My responsibility was to shift the project's focus from quantity to quality: define what a \"usable question\" meant and design a process that could consistently filter low-quality outputs while staying understandable for non-expert reviewers.", "action": "I reviewed a large batch of generated questions and categorized the most frequent failure types (grammatical errors, ambiguity, difficulty drift). I implemented lightweight grammar and style filters to catch obvious issues early. I wrote clear reviewer prompts and evaluation guidelines so reviewers applied the same standards consistently. I refined generation templates and constraints to better control topic coverage and difficulty.", "result": "The proportion of unusable questions dropped by ~30-40%, and average reviewer handling time per question dropped by ~25%. The pipeline became more predictable, with far fewer cases requiring repeated edits or rejection, letting us scale without sacrificing quality.", "source": "Q-Bank", "srcType": "project"}, "9": {"n": 9, "title": "Archaic/modern dual-corpus structure", "org": "GOLA.IO / NLP Project Lead", "primary": ["Invent and Simplify"], "all": ["Invent and Simplify", "Dive Deep", "Customer Obsession"], "situation": "At GOLA.IO, working with classical English corpora (Shakespeare, Sherlock Holmes), archaic forms like 'tis, o'er, ne'er caused frequent tokenization and POS-tagging errors. At the same time, linguists strongly insisted on preserving the original text.", "task": "Design a data structure that improved tagging accuracy without damaging or overwriting the original text, balancing linguistic integrity with computational reliability.", "action": "The core issue wasn't the tagging model but how the text was represented. I designed a dual-corpus structure: a raw_text field preserving the original archaic text exactly, and a norm_text field storing a normalized version for processing. I built a normalization lexicon mapping archaic variants ('tis → it is, o'er → over) without discarding the original. In the pipeline, all tagging and model processing ran on norm_text; visualization, manual review, and linguistic analysis referenced raw_text.", "result": "POS-tagging and tokenization errors dropped by roughly 20% (manual sampling). Linguists confirmed they could analyze texts without losing the original language, while engineers saw more stable tagging. This dual-source design later became foundational for Q-Bank, reused to generate high-quality SAT questions from classical passages.", "source": "GOLA.IO", "srcType": "project", "followup": "<h4>Deep-dive: the dual-corpus (raw_text / norm_text) design</h4><p class=\"fu-sub\">Probes: \"why two fields instead of just normalizing?\", \"how did the normalization lexicon work?\", \"what did you tag on?\", \"how did you measure the 20%?\", \"how is this different from the jangoing temporal normalizer (#31)?\"</p><h4>The core insight (Dive Deep)</h4><p>The tagging errors on Shakespeare / Sherlock were not really a model problem, they were a <b>text-representation</b> problem. Archaic forms like <code>'tis</code>, <code>o'er</code>, <code>ne'er</code> broke the tokenizer and POS tagger. But the linguists needed the original text preserved exactly (for literary and semantic analysis), so I could not just overwrite it with modern English.</p><h4>The two-field design</h4><ul><li><b>raw_text</b> — the original archaic text preserved exactly, character-for-character. Nothing is lost.</li><li><b>norm_text</b> — a normalized modern version generated for computational processing.</li><li>Both live side by side on the same record, so you always have both views of the same passage.</li></ul><h4>The normalization lexicon</h4><p>I built a lexicon mapping archaic variants to modern equivalents (<code>'tis &rarr; it is</code>, <code>o'er &rarr; over</code>, <code>ne'er &rarr; never</code>). It is a controlled, reviewable mapping, not a black-box rewrite, so a linguist can audit exactly how each form was normalized.</p><h4>How the pipeline uses each field</h4><ul><li><b>Tagging + model processing run on norm_text</b> &rarr; consistent, stable tokenization and POS tags (the engineers' need).</li><li><b>Visualization, manual review, and linguistic analysis reference raw_text</b> &rarr; the original is always the source of truth for humans (the linguists' need).</li></ul><h4>Why this is Invent and Simplify</h4><p>Instead of forcing a choice between \"accurate tagging\" and \"preserve the original,\" I separated the two concerns into two fields. One clean idea removed a whole class of conflict, and it was reusable: the same dual-source strategy later became foundational for <b>Q-Bank</b>, generating high-quality SAT questions from classical passages.</p><h4>Impact</h4><ul><li>POS-tagging and tokenization errors dropped by roughly <b>20%</b> (manual sampling).</li><li>Linguists confirmed they could analyze texts without losing the original language.</li><li>Engineers saw more stable tagging. The design was reused in Q-Bank.</li></ul><h4>Anticipated probes</h4><ul><li><b>\"Why keep raw_text at all, why not just normalize once and move on?\"</b> Because normalization is lossy for literary/semantic analysis, and it is also fallible, keeping raw_text means the original is always recoverable and auditable, and a bad normalization never destroys ground truth.</li><li><b>\"How did you build the lexicon, and how do you handle a form it does not cover?\"</b> Collected recurring variants from the corpus; an uncovered form falls back to leaving raw_text intact and flagging it, rather than guessing (same \"never silently coerce\" principle as #1 and #11).</li><li><b>\"How did you measure the ~20%?\"</b> [PLACEHOLDER: confirm the basis, e.g. manual POS/tokenization error count on a sampled set before vs after, so you can state it if pushed.]</li><li><b>\"How is this different from the jangoing temporal normalizer (#31)?\"</b> #9 preserves original vs normalized <i>text</i> for tagging; #31 grounds relative <i>dates</i> to the original utterance time. Both share the principle of a deterministic, auditable normalization layer with the raw original preserved.</li></ul>"}, "10": {"n": 10, "title": "Template + constraint question pipeline", "org": "Q-Bank / AI Problem Generator", "primary": ["Invent and Simplify"], "all": ["Invent and Simplify", "Insist on the Highest Standards"], "situation": "In Q-Bank, we used an LLM to generate SAT and TOEFL-style questions, but raw outputs were often unusable: some had multiple correct answers, others had grammar or style errors, requiring heavy manual review.", "task": "Design a generation pipeline that reliably produced usable questions meeting exam-style constraints without sacrificing scale.", "action": "Instead of treating the LLM as a black box, I restructured the system around templates and constraints. I decomposed each question into components (stem, options, distractors) and created templates for each. I defined explicit constraints: allowed grammar points, difficulty level, sentence length, answer uniqueness. After generation, I added automated validation: grammar and style filters, logical consistency checks to ensure one correct answer, rule-based rejection for violations. Only questions passing all checks were stored.", "result": "Usable rate rose from ~50% to over 80% after iterating on templates and constraints. It also changed how I think about generative models: from \"magic generators\" to components within a system that needs structure, validation, and clear standards.", "source": "Q-Bank", "srcType": "project"}, "11": {"n": 11, "title": "ETL normalization → single schema", "org": "ITFACT / STT Intern", "primary": ["Invent and Simplify"], "all": ["Invent and Simplify", "Ownership", "Deliver Results"], "situation": "At ITFACT, we prepared ASR training/evaluation data from meeting recordings and transcripts. Each client provided data in a different format with inconsistent fields, file types, and encodings, leading to repeated manual fixes and frequent pipeline errors.", "task": "Design an ETL process that could automatically convert any incoming format into a single reliable schema, so the team wouldn't reinvent the pipeline for every client.", "action": "I defined a strict target schema (required fields, accepted file types, encoding standards). I implemented Python ETL scripts that validated required fields, auto-corrected common issues, logged anomalies for traceability, and rejected/flagged invalid records. I added batch-level validation scripts to check completeness and schema consistency. I documented the whole process as an onboarding manual with QA checklists.", "result": "New project setup time dropped by ~30%, and schema-related pipeline errors decreased significantly. The process became a standard part of the team's workflow and reduced dependency on individual knowledge.", "source": "ITFACT (STT Intern)", "srcType": "role", "followup": "<h4>Deep-dive: the ETL normalization design</h4><p class=\"fu-sub\">For the Invent-and-Simplify probes: \"how did it actually work?\", \"why a single target schema?\", \"how is this different from the QA-workflow story (#7)?\", \"what did you do with data that did not fit?\"</p><h4>The core idea: converge many inputs to one schema</h4><p>Every client sent meeting data in a different shape (different fields, file types, encodings), so the team kept hand-fixing each new format. Instead of writing per-client logic forever, I defined <b>one strict target schema</b> and made every input converge to it. The complexity moves into a single, tested normalization layer instead of being scattered across every project.</p><h4>What the pipeline actually does</h4><ul><li><b>Strict target schema:</b> defined required fields, accepted file types, and encoding standards up front, so \"valid\" is unambiguous.</li><li><b>Validate:</b> Python ETL scripts check required fields on every record.</li><li><b>Auto-correct:</b> common, safe issues (e.g. encoding, predictable field variations) are fixed automatically rather than by hand.</li><li><b>Log anomalies:</b> anything unusual is logged for traceability, so problems are visible instead of silent.</li><li><b>Reject / flag:</b> records that cannot be safely normalized are rejected or flagged, not silently passed through (this is the safety line).</li><li><b>Batch-level validation:</b> a separate script checks completeness and schema consistency for the whole batch before it moves downstream.</li><li><b>Documented:</b> wrote it up as an onboarding manual + QA checklist so it is reusable, not tribal knowledge.</li></ul><h4>Why this is \"simplify,\" not just \"build\"</h4><ul><li>Before: N client formats meant N ad-hoc handling paths and repeated manual fixes.</li><li>After: N inputs &rarr; <b>one</b> normalization layer &rarr; one schema. New clients plug into the same tested path instead of a new one.</li><li>The team stopped reinventing the pipeline per client, which is exactly what dropped setup time.</li></ul><h4>Impact</h4><ul><li>New project setup time dropped by ~<b>30%</b>.</li><li>Schema-related pipeline errors decreased significantly.</li><li>Became a standard part of the team workflow and reduced dependency on any one person's knowledge.</li></ul><h4>Anticipated probes</h4><ul><li><b>\"How is this different from story #7 (delivery/QA workflow)?\"</b> #11 is the <i>ingestion/normalization</i> layer (any input format &rarr; one clean schema); #7 is the <i>delivery/QA</i> process (getting reviewed data out to clients correctly). #11 feeds the front of the pipeline, #7 governs the back. Be ready to say this clearly if both come up.</li><li><b>\"What did you do with records that did not fit the schema?\"</b> Reject or flag with an anomaly log, never silently coerce, because a silent bad normalization is worse than a visible rejection (same principle as the speaker-metadata incident, #1).</li><li><b>\"Why auto-correct some things but reject others?\"</b> Auto-correct only deterministic, safe transforms (encoding, known field aliases); anything ambiguous is flagged for a human, so the pipeline never guesses.</li><li><b>\"How did you measure the ~30%?\"</b> [PLACEHOLDER: confirm how you measured setup-time reduction, e.g. comparing new-project ramp time before vs after, so you can state the basis if pushed.]</li></ul>"}, "12": {"n": 12, "title": "Pre-meeting vocabulary feature — ASR accuracy", "org": "ITFACT / STT Intern", "primary": ["Invent and Simplify", "Dive Deep"], "all": ["Invent and Simplify", "Dive Deep", "Customer Obsession", "Bias for Action"], "situation": "During my ITFACT internship (a speech-to-text provider), I worked on automatic meeting transcription for enterprise clients. Monitoring performance, I noticed recognition accuracy dropped sharply in highly technical or professional meetings versus general discussions.", "task": "Identify the root cause and propose a practical improvement to raise accuracy for enterprise customers without a full model retraining cycle.", "action": "I dove deep into error logs and the frequently misrecognized words, and found a large portion of errors came from domain-specific vocabulary (company names, project terms, industry jargon) not represented in training data. Instead of a heavy solution (collecting massive datasets and retraining), I proposed a simpler, customer-friendly approach: a pre-meeting vocabulary input feature letting users enter key terms before the meeting so the system used them as contextual hints.", "result": "Recognition accuracy in professional meetings improved by about 12-15%, and clients spent noticeably less time correcting transcripts. It made the product more adaptable across enterprise domains since customers could tailor vocabulary without waiting for model updates.", "source": "ITFACT (STT Intern)", "srcType": "role", "followup": "<h4>Deep-dive: root-causing the accuracy drop and the lightweight fix</h4><p class=\"fu-sub\">This story is Dive Deep (finding the real cause) + Invent and Simplify (a light fix instead of retraining). Probes: \"how did you find the cause?\", \"why not just retrain?\", \"how does the feature actually work?\", \"how did you measure 12-15%?\"</p><h4>How I root-caused it (Dive Deep)</h4><ul><li><b>Segmented the problem:</b> I noticed accuracy was fine on general meetings but dropped sharply on technical/professional ones, so the cause was tied to <i>content</i>, not the audio pipeline overall.</li><li><b>Went to the error logs:</b> I looked at the specific words that were most frequently misrecognized, rather than just the aggregate error rate.</li><li><b>Found the pattern:</b> a large share of errors were <b>domain-specific vocabulary</b> the model had never seen in training, company names, project names, industry jargon, acronyms. Ordinary words were fine; the out-of-vocabulary domain terms were the failure cluster.</li></ul><h4>Why not just retrain the model?</h4><ul><li>Collecting large domain datasets and retraining is slow, expensive, and has to be repeated for every new client domain, it does not scale to \"each enterprise has its own jargon.\"</li><li>The customer needed a fix <b>now</b>, not next model cycle. Retraining also would not help a brand-new client on day one.</li><li>So I chose a mechanism the <b>customer controls</b>: they know their own terms, so let them supply them.</li></ul><h4>How the feature works</h4><p>A <b>pre-meeting vocabulary input</b>: before a meeting, users enter key terms (project names, acronyms, product names). The system uses those terms as <b>contextual hints</b> during transcription, so the recognizer is biased toward the correct domain spellings instead of guessing a common-word substitute. No model retraining, the customer tailors accuracy themselves per meeting/domain.</p><h4>Impact</h4><ul><li>Recognition accuracy in professional meetings improved by about <b>12-15%</b>.</li><li>Clients spent noticeably less time manually correcting transcripts.</li><li>The product became adaptable across enterprise domains without waiting for model updates, customers self-serve their vocabulary.</li></ul><h4>Anticipated probes</h4><ul><li><b>\"How did you measure the 12-15%?\"</b> [PLACEHOLDER: confirm the basis, e.g. word error rate on a set of technical meetings before vs after enabling the vocabulary, so you can state it if pushed.]</li><li><b>\"Could adding user vocabulary ever hurt accuracy?\"</b> Yes, over-biasing toward supplied terms could cause false matches; the honest answer is you scope hints to the meeting and keep them as soft context, not hard overrides. [Confirm how you handled this if asked.]</li><li><b>\"Why is this Invent and Simplify and not just a feature?\"</b> The simple insight is moving the fix from an expensive model-retraining problem to a cheap customer-supplied-context problem, solving a hard data-coverage gap with a light, self-serve mechanism.</li><li><b>\"How does this connect to the target role?\"</b> It is exactly the alphanumerics / domain-vocabulary challenge Speech models face (dates, names, jargon), the same class of problem the Alexa data work targets.</li></ul>"}, "13": {"n": 13, "title": "Accio Chat — failure analysis & guideline design", "org": "Accio Chat", "primary": ["Dive Deep", "Insist on the Highest Standards"], "all": ["Dive Deep", "Insist on the Highest Standards", "Learn and Be Curious"], "situation": "I worked on Accio Chat, an AI conversational chatbot. It generated creative responses but showed recurring failure patterns: hallucinated facts, style drift from the intended character voice, and occasional refusal or overly generic responses. These made the UX inconsistent and reduced trust.", "task": "Turn these failures into actionable learning signals: identify repeatable patterns, define clear evaluation criteria, and create guidelines to improve response quality at scale, rather than fixing responses one by one.", "action": "I systematically logged and reviewed failed responses, grouping them into categories (hallucination, tone inconsistency, refusal errors). Based on the analysis, I wrote reviewer guidelines defining what a \"good\" response looks like and how to flag failure types consistently. I curated and refined instruction and few-shot examples addressing the most frequent issues, so the model learned from concrete high-quality examples rather than vague feedback.", "result": "Repeated failure cases dropped by ~25-30%, and response consistency improved across similar prompts. Reviewer disagreement on acceptability decreased, cutting review time by ~20%. The system became more predictable and reliable without sacrificing creativity.", "source": "Accio Chat", "srcType": "project"}, "14": {"n": 14, "title": "APINC U-Net → realistic pivot", "org": "APINC / Cell Image Project", "primary": ["Bias for Action"], "all": ["Bias for Action", "Think Big", "Learn and Be Curious"], "situation": "In the APINC cell image analysis project, our initial goal was a U-Net segmentation model to replace Cellpose. Midway, I realized this was unrealistic given our constraints: limited labeled data, uneven ML background across the team, and most members new to Python-based research workflows.", "task": "Reassess whether continuing toward the original goal made sense, and if not, help the team redefine a direction that could still lead to meaningful, publishable results.", "action": "I stepped back and evaluated our actual resources (data amount/quality, team background, timeline). I discussed findings openly with the lead and proposed a pivot: instead of replacing Cellpose, build a reproducible analysis and feature-extraction pipeline on top of existing tools. We divided relevant papers among team members, held regular study/presentation sessions to build shared understanding, and focused development on stable pipelines and analysis code rather than raw model performance.", "result": "We shifted from an unattainable model goal to a stable, reproducible analysis pipeline with analyzable features, reusable code, and a foundation suitable for publication. I learned that changing a goal is sometimes the fastest way to move forward, and I now propose pivots early when evidence suggests the original plan won't deliver.", "source": "APINC", "srcType": "project"}, "15": {"n": 15, "title": "Fallback recommendation — cold-start", "org": "Q-Bank / AI Problem Generator", "primary": ["Invent and Simplify", "Deliver Results"], "all": ["Invent and Simplify", "Deliver Results", "Bias for Action"], "situation": "In Q-Bank, I wanted a personalized recommendation system suggesting practice questions based on a user's performance. But the product was early-stage with almost no user interaction data, making a collaborative-filtering model infeasible.", "task": "Deliver a useful recommendation experience immediately, while designing the system to evolve into a more sophisticated model once enough data was available.", "action": "Instead of waiting for data, I designed a content-based fallback recommendation system. I represented each question as a feature vector (grammar point, difficulty, length, topic). When a user answered incorrectly, the system retrieved the top-k most similar questions via k-nearest neighbors and recommended them. I structured the pipeline so this logic could later be swapped for a collaborative-filtering or hybrid model without changing the surrounding system.", "result": "We launched with a meaningful \"practice similar questions\" feature from day one, even without historical data. As interactions grew, we were prepared to transition to a more advanced model. I reused the same fallback-to-hybrid strategy for TagSpark's recommendation algorithm.", "source": "Q-Bank", "srcType": "project"}, "16": {"n": 16, "title": "Self-taught FE/UX for Q-Bank", "org": "Q-Bank / AI Problem Generator", "primary": ["Learn and Be Curious"], "all": ["Learn and Be Curious", "Bias for Action", "Invent and Simplify"], "situation": "In Q-Bank, I was comfortable with backend logic and model pipelines but had never built a real user-facing interface. When the product needed an end-to-end experience, the lack of a frontend became a blocker.", "task": "With limited time and no prior frontend background, quickly learn React essentials and basic UI/UX principles and turn the system into something users could interact with.", "action": "I learned React fundamentals through online tutorials and open-source examples, focusing on state management and component structure over visual polish. I leveraged prior experience in merchandise design and PM work, where I'd learned how visual hierarchy and information flow affect user behavior, and applied those principles, clearly separating problem statement, hints, action buttons, and navigation. I implemented the interface as reusable components and iterated on teammate feedback.", "result": "Despite it being my first frontend project, teammates said the interface felt clear and well-structured. Later, on TagSpark, I designed the initial UI much faster by reusing the same layout and hierarchy. It gave me confidence I can adapt to entirely new tech stacks as long as I understand the underlying structure.", "source": "Q-Bank", "srcType": "project"}, "17": {"n": 17, "title": "Archaic-form study → lexicon/rules", "org": "GOLA.IO / NLP Project Lead", "primary": ["Learn and Be Curious"], "all": ["Learn and Be Curious", "Dive Deep", "Invent and Simplify"], "situation": "At GOLA.IO, I worked with Shakespearean texts where archaic forms ('tis, o'er, ne'er) appeared frequently, causing consistent tokenization and POS-tagging errors that existing NLP tools didn't handle well out of the box.", "task": "Deeply understand how archaic spellings and contractions work linguistically, then translate that into practical preprocessing and tokenization rules.", "action": "I collected recurring archaic variants from the corpus and identified formation patterns. I studied linguistic literature and grammar references to understand the rules (contraction types, orthographic variation, ambiguity). I created a normalization lexicon mapping archaic forms to modern equivalents while preserving semantic intent, and implemented custom tokenization rules using spaCy's token_match so contractions split or preserved correctly by context. Rules were integrated into preprocessing and tested iteratively against real annotation samples.", "result": "Tokenization and POS-tagging errors dropped by about 20% in sampled evaluations. Annotators reported far fewer ambiguous cases. This helped me realize I enjoy bridging linguistic theory and production NLP systems.", "source": "GOLA.IO", "srcType": "project"}, "18": {"n": 18, "title": "Study/presentation sessions for mixed-background team", "org": "APINC / Cell Image Project", "primary": ["Learn and Be Curious"], "all": ["Learn and Be Curious", "Hire and Develop the Best", "Earn Trust"], "situation": "In the APINC project, the team had uneven backgrounds: some strong in biology, others in ML, and the lead new to Python. Meetings were slow and people struggled to communicate with a shared technical language.", "task": "Help the team quickly build shared understanding so we could collaborate more effectively, review code faster, and make real progress.", "action": "I organized structured study and presentation sessions. We divided papers and techniques (segmentation methods, EMT/EndMT biology, U-Net, feature extraction, evaluation metrics) among team members. Each person prepared a short, accessible presentation. After each session we discussed questions together and validated understanding with feedback from the lead.", "result": "By mid-project, meetings became much more efficient, terminology was consistent, and code reviews moved faster. I learned that raising the team's collective understanding, not just my own, is what truly accelerates progress.", "source": "APINC", "srcType": "project"}, "19": {"n": 19, "title": "Accio Chat — model/data pivot", "org": "Accio Chat", "primary": ["Learn and Be Curious"], "all": ["Learn and Be Curious", "Bias for Action"], "situation": "In Accio Chat, I built a character-style chatbot. To keep costs low and move fast, I chose an open-source model (Falcon-7B) with readily available open datasets. But output quality was clearly below bar: inconsistent responses, persona drift, and weak multi-turn context.", "task": "Figure out the real bottleneck (model vs data vs domain context) and get the system to a stable, demo-ready experience.", "action": "I treated it like controlled debugging. I categorized failure patterns (style drift, weak context retention, contradictions), then ran small experiments swapping datasets and adjusting prompt structure to isolate variables. I realized the core issue wasn't just the model: the data didn't provide dense, consistent domain context. Instead of forcing the Harry Potter theme, I pivoted to a domain where I could secure higher-quality, more coherent data and had stronger domain knowledge (an idol-focused dataset), and redefined data format and prompting constraints to emphasize tone consistency and continuity.", "result": "After the pivot, responses became noticeably more consistent, and multi-turn coherence improved enough to use as a demo. I stopped treating the model like a magic box and started treating the whole system (data, context, constraints) as the product.", "source": "Accio Chat", "srcType": "project"}, "20": {"n": 20, "title": "SAT/TOEFL difficulty factor analysis & indexing", "org": "Q-Bank / AI Problem Generator", "primary": ["Dive Deep"], "all": ["Dive Deep", "Invent and Simplify"], "situation": "In Q-Bank, difficulty levels were initially assigned intuitively. Questions labeled at the same level often felt noticeably different in difficulty, making it hard to recommend questions matching a user's proficiency.", "task": "Move away from intuition-based difficulty and define clear, explainable factors that could be measured and used consistently across generation and recommendation.", "action": "I analyzed real SAT and TOEFL questions to identify patterns correlated with perceived difficulty: sentence length, number of grammar points, presence of subordinate clauses, vocabulary difficulty, distractor design patterns. I translated each factor into a numeric score and combined them into a difficulty index, integrated into both templates and recommendation logic so difficulty became a controllable parameter rather than a vague label.", "result": "Questions tagged at the same level felt much more consistent. Feedback shifted from \"some problems feel off\" to \"the level matches what I expect.\" I strengthened my ability to turn abstract linguistic concepts into concrete, measurable features.", "source": "Q-Bank", "srcType": "project"}, "21": {"n": 21, "title": "ASR alignment/edge-case guidelines", "org": "ITFACT / STT Intern", "primary": ["Dive Deep"], "all": ["Dive Deep", "Insist on the Highest Standards", "Learn and Be Curious"], "situation": "At ITFACT, we saw recurring issues during transcript-audio alignment reviews. Fillers, code-switching, and proper nouns were handled inconsistently, so different annotators made different decisions on the same cases, leading to repeated QA failures.", "task": "Identify the patterns behind these inconsistencies and create clear, repeatable annotation guidelines applicable consistently across projects.", "action": "I collected representative samples (~100 items per project) and manually analyzed where alignment broke down, focusing on filler placement, code-switching boundaries, and proper-noun handling. I grouped these into common patterns and documented explicit rules for each case, clearly stating when content should be kept, removed, or tagged differently, with concrete examples and decision rules.", "result": "QA issues related to these edge cases dropped significantly, and annotator conflicts were noticeably reduced. I learned that even small edge-case decisions can scale into major quality and cost issues if not standardized.", "source": "ITFACT (STT Intern)", "srcType": "role"}, "22": {"n": 22, "title": "Tag co-occurrence weighted recommendation", "org": "TagSpark", "primary": ["Dive Deep"], "all": ["Dive Deep", "Deliver Results", "Customer Obsession"], "situation": "In TagSpark, recommendations originally relied only on exact tags a user selected. With multiple tags (e.g. romance + modern + healing), the query became too specific or rare, causing zero results or irrelevant top results, especially when tags had close synonyms.", "task": "Improve recommendation accuracy by better capturing what users actually meant, so even without the \"perfect\" tag the system surfaced the right works quickly.", "action": "I analyzed recent search/recommendation logs and computed tag co-occurrence. Using Jaccard and PMI, I built a tag relationship graph quantifying association strength. I moved from strict AND-only filtering to query expansion: the user's selected tags stayed the core signal, and I added closely related tags as secondary signals weighted by association strength. Final score = base(tag match) + sum(related_tag match × relatedness weight). To avoid noisy over-expansion, I added a minimum frequency cutoff for rare tags and a weight cap.", "result": "In internal tests, zero-result rate dropped ~35% (especially for rare tag combinations). Top-5 \"found what I wanted\" rate rose from ~50% to ~75%, and CTR@5 improved ~1.4×. Over 70% of survey respondents said they could find what they wanted faster. The real problem wasn't just matching tags, but inferring user intent from imperfect inputs.", "source": "TagSpark", "srcType": "project"}, "23": {"n": 23, "title": "Rule-based POS/DEP correction layer", "org": "GOLA.IO / NLP Project Lead", "primary": ["Dive Deep"], "all": ["Dive Deep", "Insist on the Highest Standards"], "situation": "In my GOLA.IO project, I built spaCy/NLTK pipelines to analyze sentence structure in classical English (Shakespeare, Sherlock Holmes). As we scaled the corpus, tagging quality dropped sharply with archaic forms (thee/thou) and elliptical constructions.", "task": "Improve tagging reliability and annotation consistency even though the models weren't trained on old or non-standard English; produce stable, repeatable outputs for downstream analysis.", "action": "I treated it as an error-pattern problem, not a model problem. I collected recurring failure cases (mislabeled thee/thou, dependency parses breaking on omitted subjects). I designed a modular rule-based correction layer on top of model outputs, writing linguistic rules to auto-adjust systematic errors and extending them as new patterns emerged. I set up a weekly manual QC process: reviewing random samples, tracking precision/recall changes, and documenting new exceptions in an error log that fed back into rule updates.", "result": "Tagging accuracy improved by about 18%, and annotation consistency stabilized across both datasets, reducing rework. I learned to systematically correct error patterns and maintain quality with automation plus human review.", "source": "GOLA.IO", "srcType": "project"}, "24": {"n": 24, "title": "Vercel cron crawling + normalization pipeline (no official API)", "org": "TagSpark / Metadata System", "primary": ["Deliver Results"], "all": ["Deliver Results", "Frugality", "Bias for Action"], "situation": "In TagSpark, I wanted to recommend web novels using signals like views, likes, comments, completion status, and publication date. The source platform had no official API, so collecting that metadata consistently was slow and fragile, and manual copy-paste would not scale.", "task": "Design and implement an automated pipeline to collect and normalize metadata under real constraints (no API, dynamic pages, changing UI) to build a stable dataset for recommendation experiments.", "action": "I built a Vercel serverless crawling API (api/scrape.js) that runs on a daily cron schedule and writes to Neon Postgres. Instead of a browser, it uses fetch() to pull each work's source HTML with a bot User-Agent and follows redirects, processing works in batches of 20. I persisted a scrape_offset cursor in a work_meta table so each run rotates through the catalog across days, and I prioritized new works and rows still missing a publication date or view count. For extraction I parsed views, likes, and comments from the embedded JSON fields (viewCount, likeCount, commentCount) and from series-metrics HTML, extracted the posted date, and normalized Korean number formats (man for times ten thousand, cheon for times one thousand). Deleted or unavailable posts are tagged with a sentinel tag (900) rather than failing the batch, and every write uses COALESCE so a null never overwrites good existing data.", "result": "I collect metadata for the full catalog on a recurring daily basis with no manual effort, giving the recommender a fresh, consistent dataset. The batched cursor keeps each cron run bounded, and COALESCE plus sentinel-tagging make the pipeline resilient to deleted posts and partial parses. It reinforced a mindset I use often: even without an official API, you can build a reliable system by designing around the constraints.", "source": "TagSpark", "srcType": "project"}, "25": {"n": 25, "title": "Q-Bank end-to-end MVP", "org": "Q-Bank / AI Problem Generator", "primary": ["Deliver Results"], "all": ["Deliver Results", "Bias for Action", "Invent and Simplify"], "situation": "In Q-Bank, we had many strong ideas around AI-generated SAT-style questions, but the system was fragmented: generation, evaluation, and user interaction were discussed separately, with no complete flow where a user could generate a question, solve it, and receive feedback.", "task": "Turn these disconnected components into a working end-to-end MVP that a real person could actually use, not just look good on paper.", "action": "I connected the full pipeline step by step. I defined structured templates and constraints for generation, then integrated LLM calls with grammar and style filters for output quality. I designed a storage format saving each question, answer, explanation, and metadata in a consistent JSON/DB schema. I built a simple frontend where users could load a question, solve it, submit an answer, and see results and feedback. I prioritized clarity and reliability over complexity, making sure each step produced outputs the next could safely consume.", "result": "A fully working MVP people could use to practice questions. Multiple users solved problems end-to-end and gave concrete feedback, making iteration faster. Lesson: instead of waiting to build a perfect research-grade system, delivering a working version early creates real value and accelerates learning.", "source": "Q-Bank", "srcType": "project"}, "26": {"n": 26, "title": "Global learning session for 700+ Data Associates", "org": "Amazon FAIA / ML Data Associate (current)", "primary": ["Ownership", "Learn and Be Curious"], "all": ["Ownership", "Learn and Be Curious", "Insist on the Highest Standards", "Earn Trust", "Dive Deep", "Think Big"], "situation": "In my current role at Amazon, I noticed a knowledge gap across our Data Associate organization. Associates were doing high-volume annotation work, but many did not clearly understand how their annotation decisions influenced Speech model training and evaluation. That gap risked inconsistent quality, because associates couldn't always connect an edge-case decision to its downstream impact on the model or the customer.", "task": "I wanted to close that gap at scale, not just for my own site, but across the global organization of more than 700 Data Associates spread across 10 sites. My goal was to connect the Language Engineers, who understand the modeling side, directly with the associates doing the annotation, and to measure whether it actually changed understanding.", "action": "I took ownership beyond my regular responsibilities. The hardest part was that no one had visibility into how many Data Associates should be involved or where they were located, and the Language Engineers were too busy to work that out. So I drove the coordination myself: I worked across the training team, the executive team, and Ops Managers to plan and schedule the session, and I went through the full DA list to determine exactly who should be included. To get a Language Engineer engaged, I started with a low-friction ask, a lunch-and-learn with one of them, and that conversation grew into the idea for a full global session. I then organized the logistics and supported communication and execution across a worldwide audience spanning multiple time zones and sites. To ensure it wasn't a one-time talk, I designed a post-session survey to measure whether it produced real learning outcomes, capturing both understanding and downstream behavior like care and confidence on hard tasks. (That relationship has continued: I'm now working with the same Language Engineers on another session for the AI Affinity Group.)", "result": "Preliminary survey results (survey still ongoing, roughly 80 respondents so far) show a strong positive impact. Participants reporting they understood the impact of their annotations \"very well\" or \"pretty well\" rose from 40% before the session to 96% afterward. 92% reported increased motivation to apply greater care and attention to their annotations, and 88% reported increased confidence when making decisions on difficult or edge-case tasks. I turned an identified learning need into a scalable, measurable development program that strengthened the connection between annotation decisions and downstream customer impact.", "source": "Amazon (current role)", "srcType": "role", "followup": "<h4>Session material: \"Speech Models Data Overview\" (26 slides, by Adeetee Bhide)</h4><p class=\"fu-sub\">This is the deck used in the global learning session. Below is the substance you can speak to if asked \"what was actually taught?\" or \"how do annotations affect the models?\"</p><h4>The three speech models (the customers of our data)</h4><table class=\"fu-table\"><tr><th>Model</th><th>What it is</th><th>Focus</th></tr><tr><td>Sonic</td><td>Cascading model (ASR &rarr; language &rarr; TTS) that preserves acoustic context (tone, prosody, style); real-time bidirectional streaming</td><td>External customers: airlines, insurance, banks, gov, theaters. EN/FR/IT/DE/ES/PT/HI launched; KO/ZH/JA next</td></tr><tr><td>Pulsar</td><td>Speech-to-speech with no text intermediary; listens and generates simultaneously (not cascading); \"learns language like a baby\"</td><td>May replace Sonic for external; could support Prime Video / Alexa</td></tr><tr><td>Transcribe</td><td>Owns many speech models (segmentation, transcription, diarization, language ID)</td><td>Enterprise: call centers, IVR, healthcare</td></tr></table><h4>What data the models need (the annotation task types)</h4><ul><li><b>Transcription</b> &mdash; what was said + which timestamps; human transcription then auto-segmentation. Golden test sets objectively evaluate ensembling (weighting transcribers by domain/noise). EN now; 19 locales soon; 58 is the goal.</li><li><b>Forced Alignment</b> &mdash; humans transcribe AND segment in one step; correct pre-segmented/pre-transcribed audio. Hard cases: overlapped speech, non-lexical voice (laughter, filled pauses), background noise, dialect variation.</li><li><b>Segmentation</b> &mdash; like forced alignment at sentence/phrase level (de-prioritized for now).</li><li><b>TTS: Voice Quality Assessment (VQA)</b> &mdash; read text, listen to TTS, flag errors: cut-off, hallucination, glitch, pronunciation, intonation, pauses, persona, speaker identity. Feeds Critical Error Rate + trains Automatic VQA.</li><li><b>Ratings / Preferences</b> &mdash; binary preference, MUSHRA, text/audio data review, overall CX preference. Used for DPO training and to train judge/reward models.</li></ul><h4>Why data quality matters (the core teaching point)</h4><ul><li>Add a word that was not said &rarr; the model learns it is OK to <b>add random extra words</b>.</li><li>Skip a word that was said &rarr; the model learns it is OK to <b>randomly skip words</b>.</li><li>Multiple speakers in one channel &rarr; the model learns to <b>randomly change voice</b>.</li></ul><p><b>Real incident:</b> LibriVox training audio had un-transcribed boilerplate (\"This is a LibriVox recording...\") &rarr; the model hallucinated it during TTS. And a hospital TTS said \"Medicine costs $200\" when the text said \"$2200\" &mdash; a Sev-2 ticket. Alphanumerics (dates, prices, flight/confirmation numbers) are a known weak spot.</li></p><h4>Practical challenges of speech data (the honest closing)</h4><ul><li>Writing/updating conventions with limited coverage; handling subjectivity and edge cases.</li><li>No single ground truth in many cases; QC and fixing annotated data is hard.</li><li>Data diversity: many accents, very short and very long audio; training on one dataset may not transfer.</li><li>Tooling: lag loading large audio files; hard to share audio for review.</li></ul><p class=\"fu-note\">Use this to answer \"what did the session actually cover?\" and to show you understand the downstream model impact of annotation quality. Full deck saved as Speech_Customer_Overview_for_DAs.pptx in this folder. (Amazon Confidential &mdash; keep to interview context.)</p>"}, "27": {"n": 27, "title": "AI Learning Initiative — affinity group coordinator", "org": "Amazon FAIA / ML Data Associate (current)", "primary": ["Ownership", "Learn and Be Curious"], "all": ["Ownership", "Learn and Be Curious", "Invent and Simplify", "Earn Trust", "Frugality"], "situation": "My team relied heavily on external training to build AI skills, and there was no consistent, team-owned forum for practical AI learning, compliance guidance, or sharing tools people built. Knowledge and useful solutions stayed siloed with individuals rather than reaching the whole team.", "task": "As a member and session coordinator for the team's AI Learning Initiative, a bi-weekly program launched August 3, 2026, my goal was to design and run a structured, repeatable learning forum that gave the team direct access to practical AI skills and compliance knowledge, and reduced our dependence on external training.", "action": "I designed the full curriculum structure across eight topic tracks: AI tool exploration, deep dives on tools in daily use, prompt writing, compliance and data classification, AI programming basics in Python and SQL, competitive analysis, supplemental GenAI Samurai curriculum content, and research resources. I added a Case Study track where team members identify recurring pain points, build AI-based solutions, and share installable outputs with the team, and I built a working-group model to tackle multi-week operational problems and produce shareable team tools. Each cycle, I coordinated scheduling, topic selection, and logistics for the 20 to 25 minute sessions with open discussion. I also proactively reached out to engineers outside the team to present, bringing in external expertise and broadening the team's exposure to AI applications beyond our daily scope.", "result": "Since the August 3 launch I have run 5 sessions (including one I personally presented on Orcha usage), each drawing 10 to 15 participants. The Case Study / working-group model is already producing real tools: a quick demo session sparked an automated answering bot for Pulsar workflows that the group is currently building. I brought in one external engineer to present so far, and one learning session grew into the global 700+ Data Associate session (see story #26), showing the initiative seeds larger wins. Overall I established a repeatable, structured learning forum that gives the team direct access to practical AI skills and compliance guidance, reduces dependency on external training, and extends existing Amazon AI curriculum (GenAI Samurai) with team-relevant material.", "source": "Amazon (current role)", "srcType": "role"}, "28": {"n": 28, "title": "Automated Slack answering bot for Data Associates", "org": "Amazon FAIA / ML Data Associate (current)", "primary": ["Dive Deep", "Invent and Simplify"], "all": ["Dive Deep", "Invent and Simplify", "Customer Obsession", "Bias for Action", "Earn Trust"], "situation": "On the Autonomy project, Data Associates weren't getting proper answers to their questions. My colleague and I scraped the main Q&A Slack channel to quantify the problem, and the data confirmed how bad it was: only 52% of questions received any response, just 24% were actually resolved, 32% of answers were workarounds rather than real fixes, 49% of questions were redundant repeats, and 30% involved miscommunication. Associates were blocked, and the same questions kept resurfacing.", "task": "With my colleague, I set out to raise response and resolution rates and cut redundancy and miscommunication, by giving associates fast, consistent, correct answers grounded in our official conventions rather than ad-hoc human replies.", "action": "My colleague pitched the idea, and we planned it together, running discovery meetings with TAMs, the customer, and the BOS team to understand each role's pain points (the tool was also meant to help engineers track tooling issues and reports). A deliberate design choice I made was to minimize the number of tools a user has to touch: I had observed that people tend not to adopt external or standalone tools, so instead of building a separate app I built the whole experience on Slack Workflows, since every Data Associate already lives in Slack all day. Meeting users inside the tool they already use was the way to actually get adoption. My specific ownership was the technical connective layer: I built the Slack Workflow that automated intake and response in the channel, and the Amazon Quick Suite agent that connected the DSL-based knowledge bank to the answering bot, so responses were grounded in authoritative conventions instead of scattered tribal knowledge.", "result": "We validated the problem across all the relevant roles and built a working first prototype quickly. On the day we finished it, though, an engineer on the customer side deployed essentially the same capability in his own version, so our bot was not the one adopted. I still delivered real value: the scraped baseline turned a vague \"DAs aren't getting answers\" complaint into a measurable problem (52% response, 24% resolved, 49% redundant), and the discovery surfaced concrete pain points across TAMs, customer, and BOS. Key lesson: validate whether a parallel effort already exists and align early with the customer's own engineers before building, so I invest in the highest-leverage version of a solution. (Frame for \"tell me about a time something didn't go as planned\" — end on the lesson.)", "source": "Amazon (current role)", "srcType": "role"}, "29": {"n": 29, "title": "Authored a versioned annotation convention for gold-label consistency", "org": "jangoing / Conversational Kitchen NLP", "source": "jangoing", "srcType": "project", "primary": ["Insist on the Highest Standards", "Earn Trust"], "all": ["Insist on the Highest Standards", "Earn Trust", "Dive Deep", "Invent and Simplify"], "situation": "In jangoing, my conversational kitchen-intelligence NLP project, I was turning everyday household utterances into structured, reviewable food-management actions. The core risk to data quality was label inconsistency

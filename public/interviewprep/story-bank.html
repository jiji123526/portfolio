: the same sentence could be labeled differently depending on who annotated it or on the day, which would poison both training and evaluation.", "task": "I needed to define gold-label decision rules so that relevance, intent, entity spans, normalized values, and dataset purpose came out as consistent as possible regardless of who labeled a sentence, and to make the rules unambiguous enough to prevent guessing.", "action": "I authored a versioned annotation convention (annotation-v4) that fixes a strict decision order for every sentence: enter the raw utterance verbatim (preserving typos, casing, contractions), pick utterance-level relevance first, then create one action per independent desired behavior, then intent, then link only the raw-text spans needed, then normalize, then assign a phrase family. I set an explicit priority rule (raw meaning over conversational context over parser prediction) and a hard safety rule: if a safe decision cannot be made from the current sentence alone, do not guess, choose needs_clarification. I also separated four relevance classes (actionable, contextual_preference, domain_non_actionable, unrelated) so annotators would not label something actionable just because food vocabulary appeared.", "result": "The convention became the single authoritative reference for labeling, making decisions reproducible across sessions and reducing ambiguous edge cases. Versioning it (v4) meant convention changes were tracked rather than silently drifting. [PLACEHOLDER: add a real metric if available, e.g. reduction in ambiguous/conflicting labels, or inter-annotator agreement before/after.]", "followup": "<h4>Deep-dive: the annotation convention (annotation-v4)</h4><p class=\"fu-sub\">This is the most role-relevant story for an ML Data Linguist. Probes: \"how do you enforce consistency if you are the only annotator?\", \"walk me through a hard case\", \"how would you measure agreement?\", \"why versioned?\", \"how do you stop needs_clarification abuse?\"</p><h4>The strict decision order (per sentence)</h4><p>The convention removes ambiguity by fixing the ORDER decisions are made, so two people (or the same person on two days) reach the same label:</p><ol><li>Enter the raw utterance <b>verbatim</b> (keep typos, casing, contractions).</li><li>Pick <b>utterance-level relevance</b> first.</li><li>Create <b>one action per independent desired behavior</b>.</li><li>Assign <b>intent</b> for each action.</li><li>Link only the <b>raw-text spans</b> actually needed.</li><li><b>Normalize</b> each span to a canonical value.</li><li>Assign a <b>phrase family</b>.</li></ol><h4>The two rules that do the heavy lifting</h4><ul><li><b>Priority rule:</b> raw meaning &gt; conversational context &gt; parser prediction. When sources conflict, this ordering decides, so annotators are not left guessing which signal wins.</li><li><b>Hard safety rule:</b> if a safe decision cannot be made from the current sentence alone, do NOT guess, choose <code>needs_clarification</code>. This is what stops silent, confident-but-wrong labels.</li></ul><h4>The 4 relevance classes (the anti-shortcut design)</h4><p>actionable / contextual_preference / domain_non_actionable / unrelated. The point: an annotator must not mark something <b>actionable just because food vocabulary appears</b>, \"I might buy milk someday\" is not an action. Separating these four prevents the model from learning a lazy keyword shortcut.</p><h4>Why versioned (annotation-v4)</h4><p>Versioning means convention changes are <b>tracked, not silently drifting</b>. If a rule changes, you know which data was labeled under which version, so you never silently mix incompatible label definitions, which is exactly how annotation quality rots over time.</p><h4>Anticipated probes</h4><ul><li><b>\"If you are the only annotator, how do you know it is consistent?\"</b> Honest answer: it is a solo project, so I engineered consistency structurally, a fixed decision order, explicit priority + needs_clarification rules, and versioning, rather than relying on multiple annotators. The convention is designed so a second annotator <i>could</i> reproduce my labels, which is the real test.</li><li><b>\"How would you measure inter-annotator agreement?\"</b> Cohen's kappa (two annotators) or Fleiss' kappa / Krippendorff's alpha (more than two), computed per layer (relevance, intent, span, normalization) since they can disagree independently. Be ready to name these.</li><li><b>\"Walk me through a genuinely ambiguous sentence.\"</b> e.g. \"we're basically out of milk\", is that mark_low or mark_out? The convention: raw meaning first (\"basically out\" implies some may remain) &rarr; mark_low; if truly undecidable from the sentence alone &rarr; needs_clarification. [Confirm with a real example from your data if you have one.]</li><li><b>\"How do you stop annotators overusing needs_clarification to dodge hard calls?\"</b> It requires a note explaining WHY it could not be decided; over-use shows up as a spike you can audit, and repeated patterns become new convention rules rather than staying ambiguous.</li><li><b>\"What is the measurable result?\"</b> [PLACEHOLDER: add a real metric if available, e.g. reduction in ambiguous/conflicting labels, or inter-annotator agreement before vs after applying the convention.]</li></ul><p class=\"fu-note\">This story maps almost one-to-one to the JD: authoring annotation conventions, resolving guideline ambiguity, and defining entity-span + normalization policy. Lead with it for Insist on the Highest Standards or Earn Trust.</p>"}, "30": {"n": 30, "title": "Built a rigorous model-evaluation and logging standard (no vanity metrics)", "org": "jangoing / Conversational Kitchen NLP", "source": "jangoing", "srcType": "project", "primary": ["Dive Deep", "Insist on the Highest Standards"], "all": ["Dive Deep", "Insist on the Highest Standards", "Deliver Results"], "situation": "In jangoing I treated model learning and validation as the primary deliverable, not an afterthought. A single aggregate accuracy number would have hidden where the language model actually failed (specific intents, date expressions, ambiguous phrasings), which is exactly where data-quality problems live.", "task": "I needed an evaluation and logging standard that would surface real error trends and prevent promoting a model just because one metric moved.", "action": "I made logging the default: every interpretation attempt (including unknown, cancelled, rejected, and corrected requests) writes an inference record with the utterance, predicted intent, raw slot spans, normalized slots, confidence, model/normalizer/prompt/schema versions, latency by stage, and the user outcome. For metrics I required intent macro-F1 and per-intent P/R/F1, entity-level slot P/R/F1, normalization accuracy by field, end-to-end exact action match, unknown-detection AUROC and false-accept rate, and calibration error, and I mandated slicing every result by 13 dimensions (phrasing family, ambiguity, date expression, utterance length, action count, unseen item, and more) because a single aggregate score is not sufficient. I gated promotion: the production model changes only after it beats the current baseline on the frozen test set and passes safety and latency gates.", "result": "This turned evaluation into a reproducible, error-trend-driven process where regressions on specific slices are visible instead of masked by an average. It directly supports diagnosing which data or intents need more coverage. [PLACEHOLDER: add a concrete result if available, e.g. a specific weak slice you found and fixed, or a regression the gate caught.]"}, "31": {"n": 31, "title": "Root-caused a temporal-grounding bug with a shared deterministic normalizer", "org": "jangoing / Conversational Kitchen NLP", "source": "jangoing", "srcType": "project", "primary": ["Dive Deep", "Invent and Simplify"], "all": ["Dive Deep", "Invent and Simplify", "Insist on the Highest Standards"], "situation": "jangoing has to interpret relative dates like 'the milk expires tomorrow.' I found two problems: relative expiry dates were sometimes grounded to the wrong reference date (the seed-generation or annotation date instead of the original utterance date), and malformed model-produced dates could turn a proposal into an HTTP 500 error.", "task": "I needed relative temporal expressions to resolve against the time of the original user utterance, deterministically and reproducibly, and to stop malformed dates from breaking the whole interpretation.", "action": "I dove into how reference_date, timezone, and created_at were being stored and used, and identified that the parser was independently consulting its own clock. I built a single shared deterministic normalizer (temporal-grounding.ts) that both the parser and annotation paths use, computing the ISO date from the exact raw span plus the original stored temporal context. I made the assistant responsible only for locating the EXPIRY_DATE text span; the API ignores any model-supplied normalized date and computes it deterministically. I made failure graceful: if a date span cannot be normalized, only that one entity is dropped while the action and other entities stay available for human review. I added regression tests for stored reference dates, later processing, timezone boundaries, invalid timezone fallback, and invalid date text, and versioned the prompt contract (annotation-ai-v6) and seed source (annotation-queue-seed-v2) so changes could not silently overwrite reviewed data.", "result": "Relative dates now resolve consistently to the original utterance's context regardless of when annotation happens, malformed model output no longer causes 500s, and the behavior is covered by regression tests. This also lays groundwork for future inventory-history questions like 'how long have these been in the fridge?' [PLACEHOLDER: add a metric if available, e.g. number of mis-grounded dates corrected or 500s eliminated.]", "followup": "<h4>Deep-dive: the temporal-grounding bug and the deterministic normalizer</h4><p class=\"fu-sub\">Strong Dive Deep story. Probes: \"what exactly was wrong?\", \"why let the model find the span but not the date?\", \"why deterministic?\", \"how did you test timezones?\", \"why version the prompt/seed?\"</p><h4>The two bugs I found (Dive Deep)</h4><ul><li><b>Wrong reference date:</b> a relative date like \"expires tomorrow\" was sometimes grounded to the <b>seed-generation date or the annotation date</b> instead of the date the user actually said it. So \"tomorrow\" could resolve to the wrong calendar day depending on when the data was processed.</li><li><b>Malformed dates crashed the request:</b> if the model produced a bad normalized date, the whole proposal became an <b>HTTP 500</b>, taking down otherwise-valid entities with it.</li></ul><h4>Root cause</h4><p>I traced how <code>reference_date</code>, <code>timezone</code>, and <code>created_at</code> were stored and used, and found the parser was <b>independently consulting its own clock</b> instead of the utterance's stored temporal context. That is why the same sentence could resolve differently at different times, non-reproducible by design.</p><h4>The fix: one shared deterministic normalizer</h4><ul><li>Built a single <code>temporal-grounding.ts</code> used by <b>both</b> the parser and the annotation paths, so there is one source of truth for date math (no divergent clocks).</li><li>It computes the ISO date from the <b>exact raw span + the original stored temporal context</b> (reference_date + timezone), not \"now\".</li><li><b>Split of responsibility:</b> the model/assistant only <b>locates the EXPIRY_DATE text span</b>; the API <b>ignores any model-supplied normalized date</b> and computes it deterministically. The model is good at \"where is the date phrase\"; it should not be trusted to do the calendar arithmetic.</li><li><b>Graceful failure:</b> if a span cannot be normalized, only that <b>one entity is dropped</b>; the action and other entities stay available for human review, no more all-or-nothing 500.</li></ul><h4>Why deterministic (not let the model do it)?</h4><ul><li><b>Reproducible:</b> same input + same stored context always yields the same date, so evaluation is stable and labels do not drift.</li><li><b>Auditable:</b> a rule you can inspect and test, versus a model output you have to trust.</li><li><b>Testable:</b> deterministic logic can be pinned with regression tests (below).</li></ul><h4>Testing + versioning (Insist on Highest Standards)</h4><ul><li>Regression tests for: stored reference dates, later processing, <b>timezone boundaries</b>, invalid-timezone fallback, and invalid date text.</li><li>Versioned the prompt contract (<code>annotation-ai-v6</code>) and seed source (<code>annotation-queue-seed-v2</code>) so a change cannot silently overwrite already-reviewed data.</li></ul><h4>Anticipated probes</h4><ul><li><b>\"Why let the model find the span but not compute the date?\"</b> Span-finding is a language task the model is good at; date arithmetic must be exact and reproducible, so it belongs in deterministic code. Separating them plays to each side's strength.</li><li><b>\"How do you handle timezone boundaries / DST?\"</b> The normalizer resolves against the utterance's stored timezone (or a UTC fallback), and I have regression tests specifically for timezone boundaries and invalid-timezone fallback.</li><li><b>\"Why drop only one entity instead of failing?\"</b> One malformed date should not discard a whole valid interpretation; partial results still let a human review the rest, higher throughput and no silent data loss.</li><li><b>\"How did you originally notice it?\"</b> Relative dates resolving to unexpected calendar days, and 500s on certain proposals, which pointed me at the reference-date + clock handling.</li><li><b>\"What is the measurable result?\"</b> [PLACEHOLDER: add a metric if available, e.g. number of mis-grounded dates corrected, or 500s eliminated on the proposal path.]</li><li><b>\"How is this different from the GOLA dual-corpus (#9)?\"</b> Both are deterministic, auditable normalization with the original preserved, #9 normalizes archaic <i>text</i> for tagging; #31 grounds relative <i>dates</i> to the original utterance time.</li></ul><p class=\"fu-note\">Role tie-in: temporal grounding and normalization are exactly the kind of data-quality + reproducibility work the ML Data Linguist role calls out.</p>"}, "32": {"n": 32, "title": "Designed the text-NLU dataset and diagnosed coverage gaps", "org": "jangoing / Conversational Kitchen NLP", "source": "jangoing", "srcType": "project", "primary": ["Dive Deep", "Ownership"], "all": ["Dive Deep", "Ownership", "Insist on the Highest Standards"], "situation": "In jangoing (framed in my portfolio as a Language Engineer / NLP systems project), I built a 5-stage annotation schema with an 11-intent ontology and an entity-span plus normalization policy, feeding a 9-queue review pipeline. Before adding voice, I needed a clean text-NLU dataset so language-understanding errors stay separable from future ASR errors. I had ~1,400 candidate records (800 synthetic-v1 plus 600 relevance-candidates-v1), but candidates are not ground truth.", "task": "I needed to fix a principled dataset design and honestly diagnose what the current data could and could not support, then define a path to a real human baseline.", "action": "I set core principles in writing: candidate is not ground truth, human-reviewed annotation becomes task-specific exports, generated data is training bootstrap only, and independent natural text is the frozen evaluation set. I decomposed the problem into stages (relevance, intent, entity span, normalization, joint action) so each is measured separately. I then audited the existing candidates and documented the concrete gaps: synthetic-v1 was missing three of the eleven supported intents (update_expiry, set_low_threshold, mark_out), had no LOCATION or EXPIRY_DATE spans, only 30 QUANTITY and 30 UNIT spans, and every actionable candidate was single-action. I defined the first human baseline target (1,000 reviewed training / 200 independently written evaluation) with explicit per-intent and per-relevance distribution targets, and specified that evaluation records must be independently written, not lightly edited templates.", "result": "This gave the project an honest, reproducible dataset design with a clear gap-targeted plan instead of merging 1,400 unreviewed candidates into one training file. The gap analysis directly drives what to collect next. [PLACEHOLDER: add progress if available, e.g. how far along the 300/100 pilot or 1,000/200 baseline is.]"}, "33": {"n": 33, "title": "Kept human review authoritative over AI-drafted labels", "org": "jangoing / Conversational Kitchen NLP", "source": "jangoing", "srcType": "project", "primary": ["Insist on the Highest Standards", "Customer Obsession"], "all": ["Insist on the Highest Standards", "Customer Obsession", "Earn Trust"], "situation": "To speed up annotation, jangoing has a Draft with AI feature that pre-fills actions, entity spans, and normalized values. The risk was obvious: annotators could rubber-stamp AI drafts, letting invented spans or over-normalized values become gold labels and quietly degrade data quality.", "task": "I needed to capture the speed benefit of AI drafting without letting it become the source of truth.", "action": "I wrote explicit rules that Draft with AI is a speed-assist for the annotator, not a gold-label generator: even when a draft is applied, the human remains fully responsible for validating intent, entity span, normalized value, and phrase family. I specified that if the AI invented a span not present in the raw text, over-normalized an ambiguous value, or chose the wrong phrase family, the annotator must not save it unchanged. I also had the system record whether an annotation was accepted exactly as-is (accepted_as_is) versus saved after edits (accepted_with_edits), so AI-influenced labels are traceable, and I kept the label-quality standard identical whether the draft came from the model or a parser fallback.", "result": "Ground truth stays the reviewed human annotation, AI assistance speeds labeling without silently lowering quality, and the accepted-as-is vs accepted-with-edits signal makes AI influence auditable. [PLACEHOLDER: add a metric if available, e.g. share of drafts edited vs accepted as-is, or errors caught.]"}, "34": {"n": 34, "title": "Re-architected yap. from a single page into a multi-tenant realtime platform", "org": "yap. / Independent Product", "source": "yap.", "srcType": "project", "primary": ["Invent and Simplify", "Deliver Results"], "all": ["Invent and Simplify", "Deliver Results", "Ownership", "Think Big"], "situation": "yap. is my independent anonymous realtime chat product (400+ active users, ~6,517 messages created in one production week). It began as a single-channel personal page built with Vanilla JS and Supabase, which could not support multiple owners, moderation, or safe anonymous participation at scale.", "task": "I wanted to turn a working single-channel prototype into a real multi-tenant platform with channel ownership, separate anonymous and authenticated identities, moderation, and media lifecycle, without throwing away the original production channel's history.", "action": "Rather than porting the old implementation, I used its behavior as a specification and redesigned yap. on Next.js, Cloudflare Workers, D1, Durable Objects, and R2. I built explicit channel ownership, separate anonymous vs authenticated identities, platform-admin authority, media lifecycle rules, and operational monitoring. I then selectively migrated the original production channel, preserving 685 messages, 204 replies, and 25 images while moving it onto the new multi-tenant model.", "result": "yap. runs as a link-first realtime platform where a guest can join a shared channel and message immediately with no account, while owners get moderation control. The original channel's full history was preserved through the migration. [PLACEHOLDER: add current scale if it has grown beyond 400+ users / 6,517 msgs per week.]"}, "35": {"n": 35, "title": "Diagnosed and fixed a database-scoped latency incident on yap.", "org": "yap. / Independent Product", "source": "yap.", "srcType": "project", "primary": ["Dive Deep", "Bias for Action"], "all": ["Dive Deep", "Bias for Action", "Ownership", "Insist on the Highest Standards"], "situation": "On yap., channel initialization suddenly slowed by 4 to 18 seconds, even though the measured SQL execution stayed in the millisecond range. Users felt the app hang on entry.", "task": "I needed to find why initialization was slow when the queries themselves were fast, and fix it without losing data.", "action": "I used route-level stage timings plus a same-code, same-data comparison on a fresh D1 database to isolate the delay to one specific database path rather than query complexity. Once I confirmed the database instance itself was the problem, I prepared and validated a production snapshot, ran integrity checks, retained a rollback copy, and moved traffic to a replacement database. To prevent recurrence, I kept stage-level latency instrumentation on core routes and started recording successful-but-abnormally-slow requests as operational health events so degradation surfaces before users feel it.", "result": "I isolated the delay to one specific D1 database path, not query complexity: SQL execution was sub-millisecond to single-digit ms, but binding/queue wait reached several seconds even for empty channels. I confirmed it with route-level stage timings and a same-code, same-data comparison on a fresh D1 database, then executed a full production database cutover: created a replacement DB in ENAM, applied all 63 migrations, imported a validated snapshot, verified row-for-row counts (16,606 messages, 42 users, 36 channels, DMs, gallery, links, FTS rows, push subscriptions all matched source), and confirmed PRAGMA quick_check = ok with no foreign-key violations. Post-cutover, /api/init dropped to 0.68s end-to-end / 80ms Worker stages. I kept the old database untouched as a rollback target and recorded slow-but-successful requests as operational health events so degradation surfaces before users feel it.", "note": "Strong Dive Deep story: the point is that the slow layer was NOT the obvious one (queries were fast); stage timings + controlled comparison found the real cause."}, "36": {"n": 36, "title": "Eliminated a recursive query that read 212M rows as history grew (yap.)", "org": "yap. / Independent Product", "source": "yap.", "srcType": "project", "primary": ["Dive Deep", "Invent and Simplify"], "all": ["Dive Deep", "Invent and Simplify", "Insist on the Highest Standards"], "situation": "On yap., production query metrics showed a single reply-thread lookup accumulating 212.62 million rows read as message history grew. This was a scaling time bomb: cost and latency would climb with every new message.", "task": "I needed to stop the runaway read amplification without breaking existing reply threads.", "action": "I audited the real reply relationships in production and confirmed that threads were only ever one level deep, which made recursive ancestry resolution completely unnecessary. Instead of incrementally tuning the recursive query, I normalized the relationship once: new replies now store the top-level root_id directly at write time, and reads use bounded batches backed by primary-key and index lookups.", "result": "Normalizing the relationship a single time removed repeated tree traversal from every read, eliminating the 212M-row amplification instead of chasing it with query tuning. [PLACEHOLDER: add before/after read counts or latency if available.]"}, "37": {"n": 37, "title": "Made message delivery idempotent to kill duplicate sends (yap.)", "org": "yap. / Independent Product", "source": "yap.", "srcType": "project", "primary": ["Dive Deep", "Customer Obsession"], "all": ["Dive Deep", "Customer Obsession", "Insist on the Highest Standards"], "situation": "On yap., a message could persist while its HTTP or WebSocket confirmation was missed, so a user would think it failed, resend, and create a duplicate. The delivery ambiguity leaked into user behavior.", "task": "I needed a delivery contract where a persisted message is acknowledged unambiguously, and retries never create duplicates.", "action": "I diagnosed that persistence, acknowledgement, fan-out, and link indexing were coupled tightly enough that delivery ambiguity reached the user. I introduced stable client_message_id values, a D1 uniqueness constraint, and an authoritative HTTP acknowledgement that together define the write result. I moved WebSocket fan-out and link indexing to run after persistence, and made retries reuse the same ID so they converge on the existing record through idempotent retries.", "result": "A persisted message is now acknowledged authoritatively and retries are idempotent, so users stop seeing duplicates from resends. The fix addressed the coupling root cause rather than patching the symptom.", "note": "Good Customer Obsession + Dive Deep: the user-visible symptom (duplicates) traced to a systems-design coupling issue."}, "38": {"n": 38, "title": "Built an interpretable rule-based recommender over an 8-dimension tag taxonomy (TagSpark)", "org": "TagSpark / Recommendations", "source": "TagSpark", "srcType": "project", "primary": ["Invent and Simplify", "Dive Deep"], "all": ["Invent and Simplify", "Dive Deep", "Insist on the Highest Standards"], "situation": "TagSpark helps users find web novels by taste. The core question was how to translate subjective taste into a recommendation query users can shape and revise, without hiding behind an unexplained black box.", "task": "I wanted a legible baseline recommender: interpretable, inspectable, and correct before adding any learned similarity.", "action": "I read all 229 works, derived a tag taxonomy inductively from recurring patterns (9 categories, 76 tags with alias sets), and hand-annotated every work, building the language dataset the source platform never provided. On top of that, I built a layered scoring engine (src/lib/reco.ts) with four evidence tiers from strongest to weakest: exact tag match (weight 1.0), alias match within the same category (0.9), same-category different-tag (0.35), and cross-category curated-cluster similarity from a hand-built tag-to-tag thesaurus. Each tier is multiplied by a per-category weight, core tags (workTags weight 2.0) earn a +0.25 bonus, and every work's score is length-normalized (divided by sqrt of its tag count) so tag-heavy works do not dominate. For alias normalization I split tokens on commas, middle dots, slashes, and pipes, then applied lowercasing, Unicode NFKC normalization, whitespace removal, and punctuation stripping before evaluating set overlap, so surface variants of the same concept collapse into one signal.", "result": "The result is an interpretable recommendation engine over a from-scratch 229-work dataset, where every recommendation is explainable by which tier and category matched, giving a legible baseline before any learned embeddings. I documented an honest limitation: clusters are hand-curated and weights are fixed constants (not learned), a deliberate interpretable-baseline choice, with a staged Phase 2 path to learned similarity only if the corpus grows. [PLACEHOLDER: add usage or satisfaction metric if available.]"}, "39": {"n": 39, "title": "Treated catalog metadata quality as part of the recommendation UX (TagSpark)", "org": "TagSpark / Recommendations", "source": "TagSpark", "srcType": "project", "primary": ["Customer Obsession", "Ownership"], "all": ["Customer Obsession", "Ownership", "Deliver Results"], "situation": "On TagSpark, recommendation quality depends entirely on the underlying catalog: if tag metadata is stale or inconsistent, even a correct ranking surfaces the wrong works. The source platform had no clean API.", "task": "I needed fresh, consistent metadata to be a reliable input to ranking, not an afterthought, and to keep it maintained over time.", "action": "I built serverless APIs (Vercel functions over Neon Postgres) that expose works and tags, support catalog management, and refresh metadata through a scheduled scrape. I treated ingestion and maintenance as part of the user experience rather than back-office plumbing, and made alias decisions (which tags count as related) an explicit product choice that changes the recommendation experience, not just the implementation.", "result": "TagSpark keeps a maintained recommendation catalog with scheduled metadata refresh, so ranking operates on fresh, consistent data. I learned that catalog quality shapes recommendation quality, so ingestion is a first-class product concern. [PLACEHOLDER: add catalog size or refresh cadence if available.]"}, "40": {"n": 40, "title": "Wrote the server-side authorization matrix so UI visibility is never access control (yap.)", "org": "yap. / Independent Product", "source": "yap.", "srcType": "project", "primary": ["Insist on the Highest Standards", "Earn Trust"], "all": ["Insist on the Highest Standards", "Earn Trust", "Dive Deep", "Ownership"], "situation": "yap. mixes anonymous guests, room viewers, logged-in users, channel owners, and platform admins across many routes. The danger in an anonymous product is treating frontend visibility as access control, which would let a forged identity read private DMs or moderate another channel.", "task": "I needed one authoritative, testable authorization boundary enforced on the server, independent of what the UI shows.", "action": "I documented and enforced a full authorization matrix: a browser-provided X-User-Id is trusted only when the request also carries the matching Worker INTERNAL_SECRET from the authenticated Next.js proxy. I defined explicit server evidence for each role (guest, room viewer, logged-in user, channel owner, platform admin, live participant), and specified per-route enforcement across /api/init, /api/unified-timeline, /api/messages, /api/dm, /api/admin, /api/upload, /ws/:channel and more. I bound room tokens and media access to the parent channel and current passcode hash so a token from one channel cannot authorize another, HMAC-hashed device/network abuse identifiers before storage, and required a functional rejection test whenever a privileged route is added. I codified review rules like never authorize from X-User-Id alone and never use UI hiding as the only owner check.", "result": "yap. has a documented, test-backed authorization boundary where forged identities, cross-visitor DM access, cross-channel tokens, stale live sessions, and passcode-rotation replays all fail closed on the server. Most highest-priority regression scenarios are automated. [PLACEHOLDER: add count of authorization regression tests if available.]"}, "41": {"n": 41, "title": "Chose NOT to partition the database and justified it with measurement (yap.)", "org": "yap. / Independent Product", "source": "yap.", "srcType": "project", "primary": ["Are Right, A Lot", "Dive Deep"], "all": ["Are Right, A Lot", "Dive Deep", "Frugality", "Invent and Simplify"], "situation": "yap.'s paid plan allows up to 50,000 D1 databases, and partitioning is a tempting reflex when latency appears. But partitioning adds cross-database consistency and rollback risk, and could be the wrong fix entirely.", "task": "I needed to decide whether to shard the database, and justify the decision with evidence rather than instinct.", "action": "I wrote an explicit executive decision: do not partition solely because the plan permits it; partition only after measurements show one database's write serialization, queueing, storage growth, or failure domain is violating a defined service objective. I documented that the current long-tail latency came from first-binding/queue wait on a security-sensitive read, which partitioning would not fix, and separated causes it can help (per-database contention) from causes it cannot (platform incidents, network distance, hot Durable Objects). I specified that any future move would start with a two-shard canary that must demonstrate improvement before expanding, keep account/routing data in a control plane, and use shard-local durable events with idempotent consumers rather than synchronous scatter-gather on user-facing paths.", "result": "I avoided a premature, high-risk architecture change by grounding the decision in measured evidence, and documented a staged, reversible path (two-shard canary first) for if and when partitioning is actually justified."}, "42": {"n": 42, "title": "Designed overlap-bucketed ranking so results feel right, not just scored high (TagSpark)", "org": "TagSpark / Recommendations", "source": "TagSpark", "srcType": "project", "primary": ["Customer Obsession", "Dive Deep"], "all": ["Customer Obsession", "Dive Deep", "Invent and Simplify"], "situation": "In TagSpark, once works have similarity scores, a naive sort by score alone can rank a work that weakly matches many tags above one that strongly matches exactly the tags the user picked. That feels wrong to users even when the number is technically higher.", "task": "I needed a ranking that respects how many of the user's selected tags a work actually contains, not just its raw score, and that cleanly separates perfect matches from related suggestions.", "action": "I split results into exact matches (works containing every selected tag) and similar works, and returned them as two labeled groups. For the similar works I bucketed by overlap count (how many selected tags the work contains) and sorted buckets from most overlap to least, then sorted within each bucket by similarity score, appending zero-overlap works last. I always excluded a reserved sentinel tag and any user-excluded tags before ranking, and used a Fisher-Yates shuffle for the cold-start case (no tags selected) so the default view stays varied.", "result": "Ranking now matches user intuition: a work matching all your tags outranks one that merely accumulates weak partial signals, and perfect vs related results are visibly separated. The design is fully deterministic and inspectable. [PLACEHOLDER: add a before/after or user-feedback signal if available.]"}}, "groups": [{"lp": "Customer Obsession", "blurb": "Start from the customer and work backwards.", "members": [{"n": 1, "title": "Speaker metadata incident — same-day fix", "primary": true}, {"n": 4, "title": "2-year free middle-school coding class", "primary": true}, {"n": 33, "title": "Kept human review authoritative over AI-drafted labels", "primary": true}, {"n": 37, "title": "Made message delivery idempotent to kill duplicate sends (yap.)", "primary": true}, {"n": 39, "title": "Treated catalog metadata quality as part of the recommendation UX (TagSpark)", "primary": true}, {"n": 42, "title": "Designed overlap-bucketed ranking so results feel right, not just scored high (TagSpark)", "primary": true}, {"n": 2, "title": "Q-Bank problem-solving UX design", "primary": false}, {"n": 7, "title": "Standardized data delivery/QA workflow", "primary": false}, {"n": 8, "title": "Q-Bank quality control — quantity to quality", "primary": false}, {"n": 9, "title": "Archaic/modern dual-corpus structure", "primary": false}, {"n": 12, "title": "Pre-meeting vocabulary feature — ASR accuracy", "primary": false}, {"n": 22, "title": "Tag co-occurrence weighted recommendation", "primary": false}, {"n": 28, "title": "Automated Slack answering bot for Data Associates", "primary": false}]}, {"lp": "Ownership", "blurb": "Act on behalf of the whole company, beyond your own scope.", "members": [{"n": 5, "title": "GOLA.IO lead-gap ownership", "primary": true}, {"n": 7, "title": "Standardized data delivery/QA workflow" >cp src dst</code> copy &middot; <code>mv src dst</code> rename/move (there is no <code>rn</code>; move = rename) &middot; <code>rm file</code> delete"], ["Quiz: view files", "<code>cat file</code> dump all &middot; <code>less file</code> scroll (q to quit) &middot; <code>head -n 10 file</code> first 10 &middot; <code>tail -n 20 file</code> last 20 &middot; <code>tail -f file</code> follow live"], ["Quiz: count &amp; search", "<code>wc -l file</code> count lines &middot; <code>grep -c \"ERROR\" file</code> OR <code>grep \"ERROR\" file | wc -l</code> count matches &middot; <code>grep -i \"error\" file</code> case-insensitive"], ["Quiz: combine (pipes)", "<code>tail -n 20 file | grep ERROR</code> last 20 then filter &middot; <code>sort names.txt | uniq -c</code> count duplicates (sort FIRST, uniq only collapses adjacent) &middot; <code>sort names.txt | uniq -c | sort -nr</code> rank most-frequent first"], ["Quiz: flag gotchas", "<code>ls -la</code> = long + <b>all/hidden</b> (a=all, not <code>-n</code> which is numeric IDs) &middot; <code>sort -n</code> numeric (not alphabetical) &middot; <code>sort -r</code> reverse &middot; so <code>-nr</code> = numeric descending (largest first)"]], "CLI": [["Fluency", "<b>Tab</b> autocompletes files/commands &middot; <b>Up arrow</b> / <code>history</code> recall &middot; <code>Ctrl+R</code> search history &middot; <code>!!</code> rerun last"], ["Chaining", "<code>&amp;&amp;</code> run next if success &middot; <code>||</code> if fail &middot; <code>;</code> regardless. e.g. <code>mkdir build &amp;&amp; cd build</code>"], ["Globbing", "<code>*</code> any chars &middot; <code>?</code> one char &middot; <code>[abc]</code> set &middot; <code>rm *.tmp</code>"], ["Virtual envs", "<code>python3 -m venv .venv</code> &middot; <code>source .venv/bin/activate</code> &middot; <code>pip install -r requirements.txt</code> &middot; <code>deactivate</code>. Why: isolate deps per project."], ["Run Python", "<code>python3 script.py --count 3</code> const PROJECTS = [{"key": "jangoing", "name": "jangoing", "tagline": "Conversational Kitchen Intelligence (NLP)", "icon": "fa-utensils", "meta": "Solo · Language Engineer & NLP Systems Designer · Python, scikit-learn, TypeScript, Next.js, Cloudflare Workers, D1, Zod", "pitch": "jangoing turns everyday household language into grounded, reviewable food-management actions. My real contribution is the language-data layer: a 5-stage annotation schema with an 11-intent ontology, entity-span and normalization rules, a 9-queue human review pipeline, and a reproducible evaluation gate. The project is not just an app, it is the environment for collecting corrections, evaluating model versions, and measuring whether language understanding actually improves.", "problem": "Natural household speech (\"we're out of milk,\" \"the milk expires tomorrow\") has to become structured, safe actions. The hard part is data quality: the same sentence can be labeled differently by different people, relative dates are ambiguous, and generated data is not ground truth. Getting that wrong poisons both training and evaluation.", "built": ["A versioned annotation convention (annotation-v4): strict decision order per sentence; hard rule to choose needs_clarification rather than guess.", "A 4-class relevance layer (actionable, contextual_preference, domain_non_actionable, unrelated) so food vocabulary alone does not imply actionable.", "An 11-intent ontology plus entity spans (ITEM, CATEGORY, QUANTITY, UNIT, LOCATION, EXPIRY_DATE) normalized to canonical household-scoped values (oat milk becomes oat_milk).", "A deterministic temporal-grounding normalizer shared by parser and annotation: relative dates resolve to the original utterance's reference_date and timezone, never the annotation date; malformed dates drop only that entity. Regression-tested; versioned prompt and seed.", "A model-evaluation and logging standard: log every attempt; intent macro-F1, slot F1, normalization accuracy, unknown-detection AUROC, calibration; slice by 13 dimensions; promote only after beating the frozen baseline and passing safety/latency gates.", "Draft with AI is a candidate, not a gold label: human validates everything; system records accepted_as_is vs accepted_with_edits so AI influence is auditable."], "results": ["Bootstrapped ~1,400 candidate examples toward a first human baseline of 1,000 train / 200 independent eval.", "Documented concrete data gaps (missing intents, no LOCATION/EXPIRY_DATE spans) to drive collection.", "Temporal grounding made reproducible; malformed dates no longer cause 500s."], "followups": ["How did you keep labels consistent? → the convention + needs_clarification rule + accepted_as_is/with_edits tracking.", "How do you know the model is improving? → slice-by-13 evaluation + frozen-test promotion gate.", "Candidate vs ground truth? → generated data is training bootstrap only; independent natural text is the frozen eval set."], "tiein": "Closest analog to the ML Data Linguist role: authoring annotation conventions, resolving guideline ambiguity, entity-span and normalization policy, and error-trend evaluation are the core of the job.", "stars": "#29 convention, #30 evaluation, #31 temporal grounding, #32 dataset design, #33 AI-draft review"}, {"key": "yap.", "name": "yap.", "tagline": "Anonymous Realtime Chat Platform", "icon": "fa-comments", "meta": "Independent product · Full-stack Product Engineer · Next.js, React, Tailwind, Cloudflare Workers, D1, Durable Objects, R2 · yapndot.com", "pitch": "yap. is a link-first anonymous chat platform: open a shared link and start talking with no account, while owners still get real moderation control. I built it end to end, and the part I most enjoy is the production engineering, because running it at real scale surfaced concrete data and reliability problems I had to root-cause and fix.", "problem": "Balance instant, account-free participation with explicit privacy, ownership, and moderation, then keep it reliable as message history grows. In an anonymous product, treating UI visibility as access control is dangerous, and long-lived realtime connections plus durable history stress the data layer.", "built": ["Re-architected a single-channel Vanilla JS + Supabase page into a multi-tenant platform on Next.js + Workers + D1 + Durable Objects + R2, migrating the original channel while preserving history.", "A server-side authorization matrix where UI visibility is never access control: X-User-Id trusted only with the matching Worker INTERNAL_SECRET; per-role/per-route enforcement; channel-bound room tokens; HMAC-hashed abuse IDs; a rejection test per privileged route.", "Incident 1 — database-scoped latency: init slowed 4 to 18s while SQL stayed sub-ms. Isolated to first D1 binding/queue wait via stage timings + fresh-DB comparison, then a full validated cutover (63 migrations, row-for-row counts, PRAGMA quick_check, rollback kept). Post-cutover /api/init 0.68s / 80ms.", "Incident 2 — recursive query amplification: one reply-thread lookup read 212.62M rows. Audited threads (one level deep), normalized root_id at write time instead of tuning the recursive query.", "Incident 3 — ambiguous delivery: missed acks caused duplicate resends. Added stable client_message_id + D1 uniqueness + authoritative HTTP ack; idempotent retries.", "A measured decision NOT to partition the database despite the plan allowing 50,000 D1s: it would not fix first-binding latency, so I documented the evidence and a two-shard-canary-first path."], "results": ["400+ active users (verify current); ~6,517 messages in one production week.", "Migration preserved 685 messages / 204 replies / 25 images.", "Latency incident: /api/init 0.68s end-to-end, 80ms Worker stages post-cutover."], "followups": ["Hardest bug you solved? → database-scoped latency incident (signal, isolation, validated cutover, prevention).", "A time you resisted the obvious solution? → the not-partitioning decision.", "How do you keep something secure? → the authorization matrix; UI is not access control."], "tiein": "The incidents are exactly what the JD means by dive deep into issues and implement solutions independently, and the data-integrity discipline (validated counts, PRAGMA checks, idempotency) is the same rigor data-quality work demands.", "stars": "#34 re-architecture, #35 latency, #36 212M-row query, #37 idempotent delivery, #40 authorization, #41 not-partitioning"}, {"key": "TagSpark", "name": "TagSpark", "tagline": "Tag-Based Recommendation for Korean Web Fiction", "icon": "fa-tags", "meta": "Solo · Language Systems & Full-stack Developer · React 18, TypeScript, Vite, Tailwind, Neon Postgres, Vercel", "pitch": "TagSpark recommends Korean web novels by taste, but the source platform had no tags at all, so the real work was the language data: I read all 229 works, built a tag taxonomy from scratch (9 categories, 76 tags with alias sets), hand-annotated every work, then built an interpretable rule-based recommender on top. It is a deliberate interpretable-baseline before any learned embeddings.", "problem": "Translate subjective taste into a recommendation query the user can shape and revise, when the source platform provides no usable metadata and Korean tags come in many surface variants.", "built": ["A from-scratch taxonomy and dataset: read all 229 works, induced 9 categories and 76 tags with alias sets, hand-annotated the full catalog (~1,630 work-tag assignments).", "Alias normalization: split on commas, middle dots, slashes, pipes, then lowercase, Unicode NFKC, whitespace removal, punctuation stripping, before set-overlap, so surface variants collapse into one signal.", "A layered interpretable scoring engine (reco.ts): exact match 1.0, alias-in-category 0.9, same-category 0.35, cross-category cluster similarity; per-category weights, +0.25 core-tag bonus, length-normalization by sqrt of tag count.", "Overlap-bucketed ranking: separate exact matches from similar; bucket similar works by how many selected tags they contain, sort buckets by overlap then score, so a full-match work beats one that accumulates weak partial signals.", "A Vercel serverless cron crawling API (api/scrape.js) to Neon Postgres: fetch-based, batches of 20 with a persisted scrape_offset cursor, prioritizes new/missing rows, parses views/likes/comments and posted date, normalizes Korean number formats, sentinel-tags deleted posts, COALESCE so nulls never overwrite good data."], "results": ["229 works, 76 tags, 9 categories, ~1,630 reviewed work-tag assignments.", "Every recommendation is explainable by which tier and category matched — a legible baseline with a documented Phase 2 path to a data-driven tag_similarity table and learned embeddings."], "followups": ["How did you handle messy/duplicate tags? → NFKC + alias-set normalization pipeline.", "Why rules instead of ML? → deliberate interpretable baseline; honest that clusters/weights are hand-curated, with a staged path to learned similarity.", "How do you keep data fresh? → batched cron crawler with cursor + COALESCE resilience."], "tiein": "Designing a taxonomy, normalizing messy human tags into comparable signals, and hand-annotating a full corpus is language-data work end to end, exactly the label, generate, and ensure the quality of datasets part of the role.", "stars": "#3 & #22 search/tag co-occurrence, #24 cron crawler, #38 recommender engine, #39 catalog quality, #42 overlap ranking"}];
const app=document.getElementById('app');const crumbs=document.getElementById('crumbs');
const searchInput=document.getElementById('search');const clrBtn=document.getElementById('clr');
let activeFilter=null; // null = All
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){s=esc(s);return s.replace(/\[(PLACEHOLDER[^\]]*)\]/g,'<span class="placeholder">[$1]</span>');}
function hl(s,q){if(!q)return esc(s);const e=esc(s);const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return e.replace(re,'<mark>$1</mark>');}
function passFilter(s){return !activeFilter || s.source===activeFilter;}

// FILTER BAR
function buildFilters(){
  const total=Object.keys(DATA.stories).length;
  let h=`<div class="frow"><span class="flabel">Show</span><span class="chip all ${activeFilter===null?'active':''}" onclick="setFilter(null)">All <span class="c">${total}</span></span></div>`;
  h+=`<div class="frow"><span class="flabel">Roles</span>`;
  DATA.filters.roles.forEach(f=>{h+=`<span class="chip ${activeFilter===f.label?'active':''}" onclick="setFilter('${f.label.replace(/'/g,"\\'")}')"><i class="fa-solid fa-briefcase" style="font-size:10px"></i> ${esc(f.label)} <span class="c">${f.count}</span></span>`;});
  h+=`</div><div class="frow"><span class="flabel">Projects</span>`;
  DATA.filters.projects.forEach(f=>{h+=`<span class="chip ${activeFilter===f.label?'active':''}" onclick="setFilter('${f.label.replace(/'/g,"\\'")}')"><i class="fa-solid fa-diagram-project" style="font-size:10px"></i> ${esc(f.label)} <span class="c">${f.count}</span></span>`;});
  h+=`</div>`;
  document.getElementById('filterbar').innerHTML=h;
}
function setFilter(f){activeFilter=f;buildFilters();const q=searchInput.value.trim();if(q){renderSearch(q);return;}if(f){renderFilterList(f);}else{renderGrid();}}
function renderFilterList(src){
  const items=Object.values(DATA.stories).filter(s=>s.source===src).sort((a,b)=>a.n-b.n);
  const isRole=(DATA.filters.roles||[]).some(r=>r.label===src);
  crumbs.innerHTML=`<a onclick="setFilter(null)">Leadership Principles</a> <i class="fa-solid fa-chevron-right" style="font-size:10px"></i> <b style="color:var(--text2)">${esc(src)}</b>`;
  let h=`<button class="back-btn" onclick="setFilter(null)"><i class="fa-solid fa-arrow-left"></i> All principles</button>`;
  h+=`<div class="section-title fade"><div class="ic"><i class="fa-solid ${isRole?'fa-briefcase':'fa-diagram-project'}"></i></div><div><h2>${esc(src)}</h2><p>${items.length} stor${items.length===1?'y':'ies'} &middot; every story with its Leadership Principle tags</p></div></div>`;
  h+='<div class="story-list fade">';
  items.forEach(s=>{
    const tags=s.all.map(lp=>{const isP=s.primary.includes(lp);return `<span class="lp-tag ${isP?'primary':'support'}" style="pointer-events:none">${esc(lp)}</span>`;}).join('');
    h+=`<div class="story-item" onclick="renderStory(${s.n},'${s.primary[0].replace(/'/g,"\\'")}')" style="align-items:flex-start;flex-direction:column;gap:9px"><div style="display:flex;align-items:center;gap:12px;width:100%"><span class="num">#${s.n}</span><div class="body"><div class="t">${esc(s.title)}</div></div><span class="chev"><i class="fa-solid fa-chevron-right"></i></span></div><div class="lp-tags" style="padding-left:38px">${tags}</div></div>`;
  });
  h+='</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}

// CHEATS
(function(){let h='';Object.keys(CHEATS).forEach(k=>{const ic=CHEAT_ICONS[k]||['fa-solid','fa-star'];h+=`<button class="cheatbtn" onclick="openCheat('${k.replace(/'/g,"\\'")}')"><i class="${ic[0]} ${ic[1]}"></i> ${esc(k)}</button>`;});document.getElementById('cheatbtns').innerHTML=h;})();
function openCheat(name){const rows=CHEATS[name];const ic=CHEAT_ICONS[name]||['fa-solid','fa-star'];let body='';rows.forEach(r=>{body+=`<div class="cheat-row"><div class="rk">${esc(r[0])}</div><div class="rv">${r[1]}</div></div>`;});document.getElementById('modal').innerHTML=`<div class="modal-head"><div class="ic"><i class="${ic[0]} ${ic[1]}"></i></div><h3>${esc(name)} &mdash; Cheat Sheet</h3><button class="x" onclick="closeCheat()">&times;</button></div><div class="modal-body">${body}</div>`;document.getElementById('overlay').classList.add('show');}
function closeCheat(){document.getElementById('overlay').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCheat();});

// SEARCH
function storyText(s){return [s.title,s.org,s.situation,s.task,s.action,s.result,s.all.join(' ')].join(' ');}
function snippet(s,q){const full=[s.situation,s.task,s.action,s.result].join(' ');const i=full.toLowerCase().indexOf(q.toLowerCase());if(i<0)return '';const start=Math.max(0,i-40);const seg=full.slice(start,start+140);return (start>0?'...':'')+hl(seg,q)+'...';}
searchInput.addEventListener('input',()=>{const q=searchInput.value.trim();clrBtn.classList.toggle('show',q.length>0);if(q.length===0){renderGrid();return;}renderSearch(q);});
function clearSearch(){searchInput.value='';clrBtn.classList.remove('show');renderGrid();searchInput.focus();}
function fSuffix(){return activeFilter?` <span style="color:var(--accent)">&middot; ${esc(activeFilter)}</span>`:'';}
function renderSearch(q){crumbs.innerHTML=`<a onclick="clearSearch()">Leadership Principles</a> <i class="fa-solid fa-chevron-right" style="font-size:10px"></i> <b style="color:var(--text2)">Search: "${esc(q)}"</b>`;const ql=q.toLowerCase();const hits=Object.values(DATA.stories).filter(s=>passFilter(s)&&storyText(s).toLowerCase().includes(ql)).sort((a,b)=>{const ra=srcRank(a.n),rb=srcRank(b.n);if(ra!==rb)return ra-rb;return a.n-b.n;});let h=`<div class="section-title fade"><div class="ic"><i class="fa-solid fa-magnifying-glass"></i></div><div><h2>${hits.length} result${hits.length===1?'':'s'}</h2><p>Matching &ldquo;${esc(q)}&rdquo;${activeFilter?' in '+esc(activeFilter):''}</p></div></div>`;if(hits.length===0){h+='<div class="empty"><i class="fa-solid fa-inbox" style="font-size:26px;display:block;margin-bottom:10px"></i>No stories match.</div>';app.innerHTML=h;return;}h+='<div class="story-list fade">';hits.forEach(s=>{const primaryLp=s.primary[0];const snip=snippet(s,q);h+=`<div class="story-item" onclick="renderStory(${s.n},'${primaryLp.replace(/'/g,"\\'")}')"><span class="num">#${s.n}</span><div class="body"><div class="t">${hl(s.title,q)}</div><div class="o">${hl(s.org,q)}</div>${snip?`<div class="snip">${snip}</div>`:''}</div><span class="badge src">${esc(s.source)}</span><span class="chev"><i class="fa-solid fa-chevron-right"></i></span></div>`;});app.innerHTML=h+'</div>';window.scrollTo(0,0);}

const SOURCE_PRIORITY={'Amazon (current role)':0,'yap.':1,'jangoing':2,'TagSpark':3};
function srcRank(n){const s=DATA.stories[n];return (s&&SOURCE_PRIORITY[s.source]!==undefined)?SOURCE_PRIORITY[s.source]:9;}
function sortMembers(ms){return ms.slice().sort((a,b)=>{if(a.primary!==b.primary)return a.primary?-1:1;const ra=srcRank(a.n),rb=srcRank(b.n);if(ra!==rb)return ra-rb;return a.n-b.n;});}
function renderGrid(){crumbs.innerHTML=`<b style="color:var(--text2)">Leadership Principles</b>${fSuffix()}`;let h='<div class="grid fade">';DATA.groups.forEach(g=>{const members=g.members.filter(m=>passFilter(DATA.stories[m.n]));const ic=ICONS[g.lp]||'fa-star';const dim=members.length===0?'dim':'';h+=`<div class="lp-card ${dim}" onclick="renderLP('${g.lp.replace(/'/g,"\\'")}')"><div class="ic"><i class="fa-solid ${ic}"></i></div><h3>${esc(g.lp)}</h3><p>${esc(g.blurb)}</p><div class="count"><b>${members.length}</b> stor${members.length===1?'y':'ies'}</div></div>`;});app.innerHTML=h+'</div>';}
function renderLP(lp){const g=DATA.groups.find(x=>x.lp===lp);const ic=ICONS[lp]||'fa-star';const members=sortMembers(g.members.filter(m=>passFilter(DATA.stories[m.n])));crumbs.innerHTML=`<a onclick="renderGrid()">Leadership Principles</a> <i class="fa-solid fa-chevron-right" style="font-size:10px"></i> <b style="color:var(--text2)">${esc(lp)}</b>${fSuffix()}`;let h=`<button class="back-btn" onclick="renderGrid()"><i class="fa-solid fa-arrow-left"></i> All principles</button><div class="section-title fade"><div class="ic"><i class="fa-solid ${ic}"></i></div><div><h2>${esc(lp)}</h2><p>${esc(g.blurb)}${activeFilter?' &middot; '+esc(activeFilter):''}</p></div></div>`;if(members.length===0){h+='<div class="empty"><i class="fa-solid fa-inbox" style="font-size:26px;display:block;margin-bottom:10px"></i>No stories for this principle under the current filter.</div>';app.innerHTML=h;return;}h+='<div class="story-list fade">';members.forEach(m=>{const s=DATA.stories[m.n];h+=`<div class="story-item" onclick="renderStory(${m.n},'${lp.replace(/'/g,"\\'")}')"><span class="num">#${m.n}</span><div class="body"><div class="t">${esc(m.title)}</div><div class="o">${esc(s.org)}</div></div><span class="badge ${m.primary?'primary':'support'}">${m.primary?'Primary':'Supports'}</span><span class="chev"><i class="fa-solid fa-chevron-right"></i></span></div>`;});app.innerHTML=h+'</div>';window.scrollTo(0,0);}
function renderStory(n,fromLP){const s=DATA.stories[n];const q=searchInput.value.trim();const backLabel=q?`Search: "${esc(q)}"`:esc(fromLP);const backFn=q?`renderSearch('${q.replace(/'/g,"\\'")}')`:`renderLP('${fromLP.replace(/'/g,"\\'")}')`;crumbs.innerHTML=`<a onclick="renderGrid()">Leadership Principles</a> <i class="fa-solid fa-chevron-right" style="font-size:10px"></i> <a onclick="${backFn}">${backLabel}</a> <i class="fa-solid fa-chevron-right" style="font-size:10px"></i> <b style="color:var(--text2)">#${n}</b>`;const tags=s.all.map(lp=>{const isP=s.primary.includes(lp);return `<span class="lp-tag ${isP?'primary':'support'}" onclick="renderLP('${lp.replace(/'/g,"\\'")}')">${esc(lp)}</span>`;}).join('');const blocks=[['S','Situation',s.situation],['T','Task',s.task],['A','Action',s.action],['R','Result',s.result]];let starH='';blocks.forEach(b=>{if(b[2])starH+=`<div class="star-block"><div class="lbl"><span class="k">${b[0]}</span>${b[1]}</div><div class="txt">${fmt(b[2])}</div></div>`;});app.innerHTML=`<button class="back-btn" onclick="${backFn}"><i class="fa-solid fa-arrow-left"></i> Back to ${backLabel}</button><div class="detail-head fade"><h2>#${n}. ${esc(s.title)}</h2><div class="org"><i class="fa-solid fa-briefcase" style="margin-right:6px;color:var(--muted)"></i>${esc(s.org)} <span class="badge src" style="margin-left:8px">${esc(s.source)}</span></div><div class="lp-tags">${tags}</div></div><div class="star fade">${starH}</div>${s.followup?`<div class="followup-wrap fade"><button class="followup-btn" id="fu-btn" onclick="toggleFollowup()"><i class="fa-solid fa-circle-question"></i> Follow-up question details<i class="fa-solid fa-chevron-right chev"></i></button><div class="followup-body" id="fu-body"><div class="fu-content">${s.followup}</div></div></div>`:''}`;window.scrollTo(0,0);}
function toggleFollowup(){var b=document.getElementById("fu-btn"),d=document.getElementById("fu-body");if(!b||!d)return;b.classList.toggle("open");d.classList.toggle("open");}

let viewMode='lp';
function setMode(m){
  viewMode=m;
  document.getElementById('mode-lp').classList.toggle('active', m==='lp');
  document.getElementById('mode-proj').classList.toggle('active', m==='proj');
  // hide filter bar + cheat search relevance? keep search usable only in lp mode
  document.querySelector('.filterbar').style.display = (m==='lp')?'':'none';
  document.querySelector('.searchbar').style.display = (m==='lp')?'':'none';
  if(m==='proj'){ renderProjects(); } else { const q=searchInput.value.trim(); if(q&&!activeFilter) renderSearch(q); else if(activeFilter) renderFilterList(activeFilter); else renderGrid(); }
}
function renderProjects(){
  crumbs.innerHTML='<b style="color:var(--text2)">Projects</b>';
  let h='<div class="proj-grid fade">';
  PROJECTS.forEach(p=>{
    h+=`<div class="proj-card" onclick="renderProject('${p.key.replace(/'/g,"\\'")}')"><div class="ic"><i class="fa-solid ${p.icon}"></i></div><h3>${esc(p.name)}</h3><div class="tl">${esc(p.tagline)}</div><p class="pitch">${esc(p.pitch.slice(0,160))}...</p></div>`;
  });
  app.innerHTML=h+'</div>';window.scrollTo(0,0);
}
function renderProject(key){
  const p=PROJECTS.find(x=>x.key===key); if(!p)return;
  crumbs.innerHTML=`<a onclick="renderProjects()">Projects</a> <i class="fa-solid fa-chevron-right" style="font-size:10px"></i> <b style="color:var(--text2)">${esc(p.name)}</b>`;
  const list=(arr)=>'<ul>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
  let h=`<button class="back-btn" onclick="renderProjects()"><i class="fa-solid fa-arrow-left"></i> All projects</button>`;
  h+=`<div class="proj-detail fade"><div class="section-title"><div class="ic"><i class="fa-solid ${p.icon}"></i></div><div><h2>${esc(p.name)}</h2><p>${esc(p.tagline)}</p></div></div>`;
  h+=`<div class="meta"><i class="fa-solid fa-circle-info" style="margin-right:6px"></i>${esc(p.meta)}</div>`;
  h+=`<div class="proj-block pitch-block"><div class="lbl">30-second pitch</div><p>${esc(p.pitch)}</p></div>`;
  h+=`<div class="proj-block"><div class="lbl">The problem</div><p>${esc(p.problem)}</p></div>`;
  h+=`<div class="proj-block"><div class="lbl">What I built</div>${list(p.built)}</div>`;
  h+=`<div class="proj-block"><div class="lbl">Results</div>${list(p.results)}</div>`;
  h+=`<div class="proj-block"><div class="lbl">Likely follow-ups</div>${list(p.followups)}</div>`;
  h+=`<div class="proj-block"><div class="lbl">Role tie-in</div><p>${esc(p.tiein)}</p></div>`;
  h+=`<div class="proj-block"><div class="lbl">Related STAR stories</div><p class="stars">${esc(p.stars)}</p></div>`;
  h+='</div>';
  app.innerHTML=h;window.scrollTo(0,0);
}

buildFilters();renderGrid();
</script>

</body></html>
